name: Fix v1.5.21 Intraday Status Preservation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/fix-v1521-status.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v1521-status-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve release version during intraday bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/bridge_intraday.py')
          s=p.read_text(encoding='utf-8')
          old='''        "mis_bridge_structure_time": structure_latest,\n        "version": "1.4.2-free",\n'''
          new='''        "mis_bridge_structure_time": structure_latest,\n        "change_radar_version": "1.0",\n'''
          if old not in s:
              raise SystemExit('legacy bridge version marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('status preservation patch applied')
          PY
          grep -q 'change_radar_version' scripts/bridge_intraday.py
          ! grep -q '"version": "1.4.2-free"' scripts/bridge_intraday.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/bridge_intraday.py
          git diff --cached --quiet || git commit -m "Preserve v1.5.21 status during intraday bridge"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
