name: Clean Build 2.0 Preview Gate

on:
  push:
    branches: [ clean-build-v2 ]
    paths:
      - 'scripts/v2/**'
      - 'docs/v2/**'
      - 'supabase/**'
      - 'contracts/**'
      - 'requirements-contract.txt'
      - '.github/workflows/v2-preview.yml'
  pull_request:
    paths:
      - 'scripts/v2/**'
      - 'docs/v2/**'
      - 'supabase/**'
      - 'contracts/**'

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-contract.txt
      - name: Contract tests
        run: python -m unittest discover -s contracts/contract-tests -p 'test_*.py' -v
      - name: Engine structural tests
        run: python -m unittest scripts.v2.test_engine -v
      - name: TradeCase structural tests
        run: python -m unittest scripts.v2.test_tradecases -v
      - name: Build deterministic v2 demo bundle
        run: python scripts/v2/build_bundle.py --demo
      - name: Validate atomic bundle
        run: python scripts/v2/validate_bundle.py
      - name: Syntax and single-writer UI gate
        run: |
          node --check docs/v2/data-source.js
          node --check docs/v2/cloud-config.js
          node --check docs/v2/portfolio-cloud.js
          node --check docs/v2/portfolio-snapshot-v1.js
          node --check docs/v2/hourly60-addon.js
          node --check docs/v2/hourly60-screener.js
          node --check docs/v2/close-mission-integrity.js
          node --check docs/v2/sector-ranking-panel.js
          node --check docs/v2/card-open-bridge.js
          node --check docs/v2/universe-search.js
          node --check docs/v2/portfolio-store.js
          node --check docs/v2/app.js
          node --check docs/v2/market-capital-renderer.js
          node --check docs/v2/stock-detail-renderer.js
          node --check docs/v2/price-map-v2-lite.js
          node --check docs/v2/portfolio-renderer.js
          node --check docs/v2/radar-transparency-v7.js
          grep -q "sector_intraday" docs/v2/sector-ranking-panel.js
          grep -q "sector_close" docs/v2/sector-ranking-panel.js
          grep -q "sectorCandidateSet" docs/v2/sector-ranking-panel.js
          grep -q "INUKO PRICE MAP" docs/v2/price-map-v2-lite.js
          grep -q "isd-zone" docs/v2/price-map-v2-lite.js
          grep -q "price-map-v2-lite.js?v=20261002inuko1" docs/v2/index.html
          ! grep -q "DOGSON PRICE MAP" docs/v2/price-map-v2-lite.js
          grep -q "data-h60-preset=\"unheated\"" docs/v2/hourly60-screener.js
          grep -q "function isUnheatedStart" docs/v2/hourly60-screener.js
          grep -q "hourly60-screener.js?v=20261002h60screen2" docs/v2/data-source.js
          grep -q "portfolio-cloud.js?v=20261002cloud1" docs/v2/data-source.js
          grep -q "portfolio-snapshot-v1.js?v=20261002cloud1" docs/v2/data-source.js
          grep -q "INUKO_CLOUD_CONFIG" docs/v2/cloud-config.js
          grep -q "inuko_ensure_default_accounts" docs/v2/portfolio-cloud.js
          grep -q "inuko_portfolio_snapshots" docs/v2/portfolio-snapshot-v1.js
          python scripts/v2/validate_single_writer_ui.py
          python -m py_compile scripts/v2/validate_mission_evidence.py
          python -m py_compile scripts/v2/rebuild_close_rank_views.py
          python -m py_compile scripts/v2/build_radar_stats.py
          python -m py_compile scripts/v2/enrich_zones.py
          python -m py_compile scripts/v2/build_stock_shards.py
      - name: Portfolio Cloud security gate
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('docs/v2/cloud-config.js').read_text(encoding='utf-8')
          js=Path('docs/v2/portfolio-cloud.js').read_text(encoding='utf-8')
          snap=Path('docs/v2/portfolio-snapshot-v1.js').read_text(encoding='utf-8')
          sql=Path('supabase/migrations/20261002_0001_inuko_portfolio_cloud.sql').read_text(encoding='utf-8')
          assert 'service_role:' not in cfg.lower()
          assert 'service_role=' not in cfg.lower()
          assert 'enable row level security' in sql.lower()
          for table in ('inuko_brokerage_accounts','inuko_portfolio_ledgers','inuko_fee_profiles','inuko_portfolio_snapshots'):
              assert table in sql
          assert 'auth.uid() = user_id' in sql
          assert 'persistSession:true' in js
          assert "from('inuko_portfolio_snapshots')" in snap
          assert ".upsert(" in snap
          assert "onConflict:'account_id,snapshot_date'" in snap
          print('INUKO Portfolio Cloud browser/RLS/snapshot gate OK')
          PY
      - name: S/R 3.0 structural gate
        run: |
          python - <<'PY'
          from scripts.v2.enrich_zones import fused_levels

          row={
            'close':100,'ma5':99.2,'ma10':98.7,'ma20':97.8,
            'low':98.9,'high':102.0,
            'dynamic_profile':{'atr14_pct':2.8},
            'support':{'low':97.0,'high':98.1,'center':97.55,'strength':4,'basis':'成交密集區＋20MA＋前波低點','evidence_count':3},
            'resistance':{'low':102.4,'high':103.6,'center':103.0,'strength':4,'basis':'前波高點＋大量成交區','evidence_count':2},
          }
          h={'ma20_60':99.0,'ma60_60':97.6,'ma240_60':94.5}
          s=fused_levels(row,'SUPPORT',h)
          r=fused_levels(row,'RESISTANCE',h)
          assert s and r, (s,r)
          assert s[0]['rank']=='S1' and r[0]['rank']=='R1'
          assert all(x.get('confidence') is not None for x in s+r)
          assert all(x.get('validation_condition') and x.get('invalidation_condition') for x in s+r)
          print('S/R 3.0 synthetic:',s,r)
          PY
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogson-clean-build-v2-preview
          path: docs/v2
          if-no-files-found: error
