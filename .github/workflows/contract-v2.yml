name: Clean Build 2.0 Contract Gate

on:
  push:
    branches: [ clean-build-v2 ]
    paths:
      - 'contracts/**'
      - 'scripts/sector_groups.py'
      - 'scripts/v2/legacy_adapter.py'
      - 'scripts/v2/validate_sector_registry.py'
      - 'docs/data/universe.json'
      - 'docs/data/close.json'
      - 'requirements-contract.txt'
      - '.github/workflows/contract-v2.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/sector_groups.py'
      - 'scripts/v2/legacy_adapter.py'
      - 'scripts/v2/validate_sector_registry.py'
      - 'docs/data/universe.json'
      - 'docs/data/close.json'
      - 'requirements-contract.txt'
      - '.github/workflows/contract-v2.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-contract.txt
      - name: Run contract tests
        run: python -m unittest discover -s contracts/contract-tests -p 'test_*.py' -v
      - name: Validate Sector Taxonomy registry and coverage
        run: python scripts/v2/validate_sector_registry.py
