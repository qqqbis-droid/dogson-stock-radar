name: Deploy Radar v1.7.2 UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_system_status.py"
      - ".github/workflows/deploy-ui-v1531.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production publisher queue. UI publishes wait for market-data publishers
# and never replace live data with an older repository snapshot.
concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical UI assets and version contract
        run: |
          node --check docs/ui-filters.js
          node --check docs/redesign-v160.js
          node --check docs/ui-polish-v160.js
          node --check docs/ui-layout-v162.js
          node --check docs/ui-card-v164.js
          node --check docs/ui-card-v166.js
          node --check docs/ui-fold-v167.js
          node --check docs/ui-entry-v1679.js
          node --check docs/ui-freshness-v1688.js
          node --check docs/ui-system-status-v1700.js
          node --check docs/ui-page-architecture-v1701.js
          node --check docs/ui-accuracy-guard-v1702.js
          node --check docs/ui-dual-decision-v1690.js
          node --check docs/ui-filter-ux-v1721.js
          node --check docs/ui-filter-refine-v1722.js
          node --check docs/ui-filter-integrity-v1723.js
          node --check docs/ui-stage-source-v1724.js
          node --check docs/ui-load-more-v1681.js
          node --check docs/ui-market-v1685.js
          node --check docs/ui-market-ticker-v1686.js
          node --check docs/realtime.js
          node --check docs/realtime-config.js
          node --check docs/sw.js

          python - <<'PY'
          from pathlib import Path
          from scripts.build_system_status import APP_VERSION

          token = APP_VERSION.replace('.', '') + '0'
          files = {
              'realtime': Path('docs/realtime-config.js').read_text(encoding='utf-8'),
              'loader': Path('docs/ui-filters.js').read_text(encoding='utf-8'),
              'sw': Path('docs/sw.js').read_text(encoding='utf-8'),
              'status_ui': Path('docs/ui-system-status-v1700.js').read_text(encoding='utf-8'),
          }
          checks = [
              (f'ui-filters.js?v={token}', files['realtime']),
              (f'__DOGSON_UI_LOADER_V{token}__', files['loader']),
              (f"const CACHE='dogson-free-v{token}'", files['sw']),
              (f"const UI_VERSION='{token}'", files['sw']),
              (f"DOGSON_APP_VERSION='{APP_VERSION}'", files['status_ui']),
              (f'資料狀態・v{APP_VERSION}', files['status_ui']),
              ('ui-system-status-v1700.js', files['loader']),
              ('ui-page-architecture-v1701.js', files['loader']),
              ('ui-accuracy-guard-v1702.js', files['loader']),
              ('ui-filter-ux-v1721.js', files['loader']),
              ('ui-filter-refine-v1722.js', files['loader']),
              ('ui-filter-integrity-v1723.js', files['loader']),
              ('ui-filter-integrity-v1723.js', files['sw']),
              ('ui-stage-source-v1724.js', files['loader']),
              ('ui-stage-source-v1724.js', files['sw']),
          ]
          missing = [needle for needle, text in checks if needle not in text]
          if missing:
              raise SystemExit(f'UI version contract mismatch for {APP_VERSION}: {missing}')
          if "client.navigate" in files['sw']:
              raise SystemExit('service worker must not force client navigation')
          print('UI version contract ok:', APP_VERSION, token)
          PY

      - name: Preserve newest published market data without rollback
        shell: bash
        run: |
          set -euo pipefail
          base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
          critical=(close.json market.json intraday.json hourly.json daytrade.json system_status.json)
          optional=(universe.json status.json chip_history.json chip_status.json mis_snapshots.json validation_history.json validation.json decision_history.json)
          mkdir -p docs/data

          for name in "${critical[@]}"; do
            tmp="docs/data/${name}.live"
            if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 25 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" || ! test -s "$tmp"; then
              rm -f "$tmp"
              echo "ERROR: live critical data unavailable: $name; refusing UI deploy to avoid data rollback"
              exit 1
            fi
            mv "$tmp" "docs/data/$name"
            echo "preserved live critical $name"
          done

          for name in "${optional[@]}"; do
            tmp="docs/data/${name}.live"
            if curl -fsSL --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" && test -s "$tmp"; then
              mv "$tmp" "docs/data/$name"
              echo "preserved live optional $name"
            else
              rm -f "$tmp"
              echo "WARN: optional live data unavailable: $name; repository copy retained"
            fi
          done

      - name: Rebuild and verify canonical data truth
        run: |
          python scripts/build_system_status.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_system_status import APP_VERSION

          s=json.loads(Path('docs/data/system_status.json').read_text(encoding='utf-8'))
          if s.get('app_version') != APP_VERSION:
              raise SystemExit(f"wrong app_version: {s.get('app_version')} != {APP_VERSION}")
          if not s.get('latest_completed_trade_date'):
              raise SystemExit('latest_completed_trade_date missing')
          for key in ('market','close','intraday','hourly','daytrade'):
              if not (s.get('dates') or {}).get(key):
                  raise SystemExit(f'critical trading date missing: {key}')
          print('canonical data truth=', json.dumps(s, ensure_ascii=False))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
