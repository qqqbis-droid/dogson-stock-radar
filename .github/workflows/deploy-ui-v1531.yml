name: Deploy Radar v1.6.8.7 UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-ui-v1531.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify UI assets
        run: |
          node --check docs/ui-filters.js
          node --check docs/ui-filters-core-v1531.js
          node --check docs/redesign-v160.js
          node --check docs/ui-polish-v160.js
          node --check docs/ui-layout-v162.js
          node --check docs/ui-card-v164.js
          node --check docs/ui-card-v166.js
          node --check docs/ui-fold-v167.js
          node --check docs/ui-entry-v1679.js
          node --check docs/ui-freshness-v1687.js
          node --check docs/ui-load-more-v1681.js
          node --check docs/ui-market-v1685.js
          node --check docs/ui-market-ticker-v1686.js
          node --check docs/realtime.js
          node --check docs/sw.js
          test -s docs/contrast-v160.css
          test -s docs/redesign-v162.css
          test -s docs/redesign-v162-fix.css
          test -s docs/redesign-v163.css
          test -s docs/redesign-v164.css
          test -s docs/redesign-v165.css
          test -s docs/redesign-v166.css
          test -s docs/redesign-v1679.css
          test -s docs/redesign-v1685.css
          test -s docs/redesign-v1686.css
          grep -q "ui-filters.js?v=1687" docs/realtime-config.js
          grep -q "dogson-free-v1687" docs/sw.js
          grep -q "dogson-boot-v1687" docs/sw.js
          grep -q "DOGSON_UI_LOADER_V1687" docs/ui-filters.js
          grep -q "dogson-booting" docs/ui-filters.js
          grep -q "dogsonUiReady" docs/ui-filters.js
          grep -q "redesign-v1685.css" docs/ui-filters.js
          grep -q "redesign-v1686.css" docs/ui-filters.js
          grep -q "ui-freshness-v1687.js" docs/ui-filters.js
          grep -q "ui-market-v1685.js" docs/ui-filters.js
          grep -q "ui-market-ticker-v1686.js" docs/ui-filters.js
          grep -q "ui-freshness-v1687.js?v=1687" docs/sw.js
          grep -q "ui-market-ticker-v1686.js?v=1687" docs/sw.js
          grep -q "redesign-v1686.css?v=1687" docs/sw.js
          grep -q "DOGSON_FRESHNESS_V1687" docs/ui-freshness-v1687.js
          grep -q "DOGSON_INTRADAY_STALE" docs/ui-freshness-v1687.js
          grep -q "最新盤後資料" docs/ui-freshness-v1687.js
          grep -q "DOGSON_MARKET_TICKER_V1687" docs/ui-market-ticker-v1686.js
          grep -q "9/" docs/ui-market-ticker-v1686.js || true
          grep -q "加權" docs/ui-market-ticker-v1686.js
          grep -q "櫃買" docs/ui-market-ticker-v1686.js
          grep -q "setInterval(render,3000)" docs/ui-market-ticker-v1686.js
          grep -q "dogson-market-ticker-v1686" docs/redesign-v1686.css
          grep -q "DOGSON_MARKET_HOME_V1685" docs/ui-market-v1685.js
          grep -q "市場環境" docs/ui-market-v1685.js
          grep -q "市場分數" docs/ui-market-v1685.js
          grep -q "加權指數" docs/ui-market-v1685.js
          grep -q "櫃買指數" docs/ui-market-v1685.js
          grep -q "交易日" docs/ui-market-v1685.js
          grep -q "資金流向" docs/ui-market-v1685.js
          grep -q "個股雷達" docs/ui-market-v1685.js
          grep -q "查看市場細節" docs/ui-market-v1685.js
          grep -q "查看完整資金流向" docs/ui-market-v1685.js
          grep -q "defaultFocus:false" docs/ui-filters-core-v1531.js
          grep -q "sort((a,b)=>scoreOf(b)-scoreOf(a))" docs/ui-filters-core-v1531.js
          grep -q "目前顯示全部掃描結果" docs/ui-filters-core-v1531.js
          grep -q "#dogsonQuickFilters \[data-all\]" docs/ui-filters-core-v1531.js
          grep -q "dogson-card-brief>.dogson-card-badges" docs/redesign-v1679.css
          grep -q "ui-load-more-v1681.js" docs/ui-filters.js
          grep -q "ui-load-more-v1681.js?v=1687" docs/sw.js
          grep -q "DOGSON_LOAD_MORE_V1681" docs/ui-load-more-v1681.js
          grep -q "dogsonOriginalLoadMore" docs/ui-load-more-v1681.js
          ! grep -q "client.navigate" docs/sw.js
          grep -q "replaceAll('location.reload();','void 0;')" docs/sw.js
          grep -q "DOGSON_MARKET_ADVISORY_V1680" docs/ui-entry-v1679.js
          grep -q "市場環境提醒" docs/ui-entry-v1679.js
          grep -q "系統性風險煞車" docs/ui-entry-v1679.js
          grep -q "大盤只調節部位與進場保守度" docs/ui-entry-v1679.js
          grep -q "dogson-entry-market-advisory" docs/redesign-v1679.css
          grep -q "ui-entry-v1679.js" docs/ui-filters.js
          grep -q "redesign-v1679.css" docs/ui-filters.js
          grep -q "還差什麼" docs/ui-entry-v1679.js
          grep -q "已經成立" docs/ui-entry-v1679.js
          grep -q "失效警戒" docs/ui-entry-v1679.js
          grep -q "查看技術細節" docs/ui-entry-v1679.js
          grep -q "stageGuide" docs/ui-card-v164.js
          grep -q "階段定位" docs/ui-card-v164.js
          grep -q "進場燈號" docs/ui-card-v164.js
          ! grep -q "目前策略" docs/ui-card-v164.js
          grep -q "canonicalRow" docs/ui-card-v166.js
          grep -q "canonicalSignalSpec" docs/ui-card-v166.js
          grep -q "canonicalConclusion" docs/ui-card-v166.js
          grep -q "normalizePortfolioButton" docs/ui-card-v166.js
          grep -q "portfolioView" docs/ui-card-v166.js
          grep -q "> .top .cat" docs/redesign-v166.css
          grep -q "> .top .quality" docs/redesign-v166.css
          grep -q "portfolio-mini.held" docs/redesign-v165.css
          grep -q "dogson-signal-btn-v166" docs/redesign-v165.css
          grep -q "portfolio-summary-item" docs/redesign-v166.css
          grep -q "portfolio-modal" docs/redesign-v166.css
          grep -q "dogson-card-details" docs/ui-fold-v167.js
          grep -q "openState" docs/ui-fold-v167.js
          ! grep -q "ui-interactions-v163.js" docs/ui-filters.js
          grep -q "多時間框架" docs/ui-polish-v160.js
          grep -q "最近一筆成交價" docs/realtime.js
      - name: Preserve newest published market data
        shell: bash
        run: |
          set -u
          base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
          files=(universe.json close.json market.json intraday.json hourly.json status.json chip_history.json chip_status.json mis_snapshots.json validation_history.json validation.json daytrade.json decision_history.json)
          mkdir -p docs/data
          for name in "${files[@]}"; do
            tmp="docs/data/${name}.live"
            if curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" && test -s "$tmp"; then
              mv "$tmp" "docs/data/$name"
              echo "preserved live $name"
            else
              rm -f "$tmp"
              echo "live $name unavailable; keeping repository copy"
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
