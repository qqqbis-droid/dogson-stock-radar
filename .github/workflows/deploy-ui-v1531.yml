name: Deploy Radar v1.7.1 UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_system_status.py"
      - ".github/workflows/deploy-ui-v1531.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Use the same production lock as intraday/close publishers so an UI-only
# publish cannot restore an older market snapshot over a newer data publish.
concurrency:
  group: dogson-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify v1.7.1 UI assets
        run: |
          node --check docs/ui-filters.js
          node --check docs/redesign-v160.js
          node --check docs/ui-polish-v160.js
          node --check docs/ui-layout-v162.js
          node --check docs/ui-card-v164.js
          node --check docs/ui-card-v166.js
          node --check docs/ui-fold-v167.js
          node --check docs/ui-entry-v1679.js
          node --check docs/ui-freshness-v1688.js
          node --check docs/ui-system-status-v1700.js
          node --check docs/ui-page-architecture-v1701.js
          node --check docs/ui-accuracy-guard-v1702.js
          node --check docs/ui-dual-decision-v1690.js
          node --check docs/ui-load-more-v1681.js
          node --check docs/ui-market-v1685.js
          node --check docs/ui-market-ticker-v1686.js
          node --check docs/realtime.js
          node --check docs/realtime-config.js
          node --check docs/sw.js

          grep -q "ui-filters.js?v=1710" docs/realtime-config.js
          grep -q "dogson-free-v1710" docs/sw.js
          grep -q "UI_VERSION='1710'" docs/sw.js
          grep -q "DOGSON_UI_LOADER_V1710" docs/ui-filters.js
          grep -q "ui-system-status-v1700.js" docs/ui-filters.js
          grep -q "ui-page-architecture-v1701.js" docs/ui-filters.js
          grep -q "ui-accuracy-guard-v1702.js" docs/ui-filters.js
          grep -q "ui-system-status-v1700.js?v=1710" docs/sw.js
          grep -q "ui-page-architecture-v1701.js?v=1710" docs/sw.js
          grep -q "ui-accuracy-guard-v1702.js?v=1710" docs/sw.js
          grep -q "DOGSON_SYSTEM_STATUS_V1710" docs/ui-system-status-v1700.js
          grep -q "DOGSON_PAGE_ARCH_V1710" docs/ui-page-architecture-v1701.js
          grep -q "DOGSON_ACCURACY_GUARD_V1710" docs/ui-accuracy-guard-v1702.js
          grep -q "DOGSON_APP_VERSION='1.7.1'" docs/ui-system-status-v1700.js
          grep -q "資料狀態・v1.7.1" docs/ui-system-status-v1700.js
          grep -q "最近完整波段候選" docs/ui-page-architecture-v1701.js
          grep -q "當沖資料暫停" docs/ui-page-architecture-v1701.js
          grep -q "當沖舊資料已停用" docs/ui-accuracy-guard-v1702.js
          grep -q "找波段已啟用資料保護" docs/ui-accuracy-guard-v1702.js
          grep -q "DOGSON_DUAL_DECISION_V1690" docs/ui-dual-decision-v1690.js
          grep -q "DOGSON_FRESHNESS_V1688" docs/ui-freshness-v1688.js
          ! grep -q "client.navigate" docs/sw.js
          grep -q "replaceAll('location.reload();','void 0;')" docs/sw.js

      - name: Preserve newest published market data
        shell: bash
        run: |
          set -u
          base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
          files=(universe.json close.json market.json intraday.json hourly.json status.json system_status.json chip_history.json chip_status.json mis_snapshots.json validation_history.json validation.json daytrade.json decision_history.json)
          mkdir -p docs/data
          for name in "${files[@]}"; do
            tmp="docs/data/${name}.live"
            if curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" && test -s "$tmp"; then
              mv "$tmp" "docs/data/$name"
              echo "preserved live $name"
            else
              rm -f "$tmp"
              echo "live $name unavailable; keeping repository copy"
            fi
          done

      - name: Rebuild canonical data truth from preserved live files
        run: |
          python scripts/build_system_status.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/data/system_status.json').read_text(encoding='utf-8'))
          if s.get('app_version') != '1.7.1':
              raise SystemExit(f"wrong app_version: {s.get('app_version')}")
          if not s.get('latest_completed_trade_date'):
              raise SystemExit('latest_completed_trade_date missing')
          print('canonical data truth=', json.dumps(s, ensure_ascii=False))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
