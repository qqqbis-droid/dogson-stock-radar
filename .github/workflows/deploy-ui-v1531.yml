name: Deploy Radar v1.6.1 UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-ui-v1531.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify UI assets
        run: |
          node --check docs/ui-filters.js
          node --check docs/ui-filters-core-v1531.js
          node --check docs/redesign-v160.js
          node --check docs/ui-polish-v160.js
          node --check docs/realtime.js
          test -s docs/contrast-v160.css
          grep -q "ui-filters.js?v=1601" docs/realtime-config.js
          grep -q "redesign-v160.css" docs/ui-filters.js
          grep -q "redesign-v160-dark.css" docs/ui-filters.js
          grep -q "contrast-v160.css" docs/ui-filters.js
          grep -q "redesign-v160.js" docs/ui-filters.js
          grep -q "ui-polish-v160.js" docs/ui-filters.js
          grep -q "dogson-overview" docs/redesign-v160.css
          grep -q "dogson-card-headline" docs/redesign-v160.js
          grep -q "html\[data-dogson-theme=\"light\"\]" docs/contrast-v160.css
          grep -q "多時間框架" docs/ui-polish-v160.js
          grep -q "最近一筆成交價" docs/realtime.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
