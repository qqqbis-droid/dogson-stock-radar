name: Deploy Radar v1.6.7.5 UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-ui-v1531.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify UI assets
        run: |
          node --check docs/ui-filters.js
          node --check docs/ui-filters-core-v1531.js
          node --check docs/redesign-v160.js
          node --check docs/ui-polish-v160.js
          node --check docs/ui-layout-v162.js
          node --check docs/ui-card-v164.js
          node --check docs/ui-card-v166.js
          node --check docs/ui-fold-v167.js
          node --check docs/realtime.js
          node --check docs/sw.js
          test -s docs/contrast-v160.css
          test -s docs/redesign-v162.css
          test -s docs/redesign-v162-fix.css
          test -s docs/redesign-v163.css
          test -s docs/redesign-v164.css
          test -s docs/redesign-v165.css
          test -s docs/redesign-v166.css
          grep -q "ui-filters.js?v=1675" docs/realtime-config.js
          grep -q "dogson-free-v1675" docs/sw.js
          grep -q "canonicalRow" docs/ui-card-v166.js
          grep -q "canonicalSignalSpec" docs/ui-card-v166.js
          grep -q "canonicalConclusion" docs/ui-card-v166.js
          grep -q "normalizePortfolioButton" docs/ui-card-v166.js
          grep -q "portfolioView" docs/ui-card-v166.js
          grep -q "portfolio-mini.held" docs/redesign-v165.css
          grep -q "dogson-signal-btn-v166" docs/redesign-v165.css
          grep -q "portfolio-summary-item" docs/redesign-v166.css
          grep -q "portfolio-modal" docs/redesign-v166.css
          grep -q "dogson-card-details" docs/ui-fold-v167.js
          grep -q "openState" docs/ui-fold-v167.js
          ! grep -q "ui-interactions-v163.js" docs/ui-filters.js
          grep -q "多時間框架" docs/ui-polish-v160.js
          grep -q "最近一筆成交價" docs/realtime.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
