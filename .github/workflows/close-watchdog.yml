name: Radar - Close Freshness Recovery Watchdog

# After 15:17 recover a missing same-day official close. In the evening,
# recover late institutional chips separately. Reuse the production close
# workflow, with all its verified date/coverage gates. No GitHub API dispatch.
on:
  workflow_dispatch:
  schedule:
    # Taiwan 15:17 and 16:17: validate delayed/missed after-close publishing.
    - cron: "17 7,8 * * 1-5"
    # Taiwan 19:17, 21:17, 23:17: late institution date recovery.
    - cron: "17 11,13,15 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-evening-close-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      refresh: ${{ steps.audit.outputs.refresh }}
    steps:
      - id: audit
        name: Verify current trading session and lagging source clocks
        shell: bash
        run: |
          set -euo pipefail
          echo "refresh=false" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,sys,urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now=datetime.now(ZoneInfo('Asia/Taipei'))
          if now.weekday() >= 5 or not (15 <= now.hour <= 23):
              print('Outside weekday post-close recovery window')
              sys.exit(0)
          today=now.date().isoformat()
          root='https://qqqbis-droid.github.io/dogson-stock-radar/data/'
          def fetch(name):
              req=urllib.request.Request(root+name+'?eod_probe='+str(int(now.timestamp())),
                headers={'User-Agent':'Dogson-Close-Watchdog/2.0',
                         'Cache-Control':'no-cache, no-store','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=14) as r:
                  return json.load(r)
          try:
              system=fetch('system_status.json')
              chip=fetch('chip_status.json')
          except Exception as exc:
              print('Cannot read verified published data; refuse to dispatch:',str(exc)[:250])
              sys.exit(0)
          close_date=str((system.get('dates') or {}).get('close') or '')[:10]
          verified=str(system.get('latest_completed_trade_date') or '')[:10]
          source=chip.get('latest_source_dates') or {}
          foreign=str(source.get('foreign') or '')[:10]
          trust=str(source.get('trust') or '')[:10]
          close_current=(close_date==today and verified==today)
          print('Official-source dates',
                {'completed_close':close_date,'verified':verified,'foreign':foreign,
                 'trust':trust,'chip':source.get('chip'),'today':today})
          if close_current:
              if now.hour<19:
                  print('Close is current; institution backfill is evening-only')
                  sys.exit(0)
              if foreign==today and trust==today:
                  print('Both institution sources current; no action')
                  sys.exit(0)
          else:
              # Guard against weekends, exchange holidays and typhoon closures:
              # stale published close is NOT evidence that a newer session exists.
              # Require an actual official TWSE MIS closing index dated today.
              if not (close_date and close_date < today):
                  print('Unknown/invalid close date; fail closed')
                  sys.exit(0)
              try:
                  url=('https://mis.twse.com.tw/stock/api/getStockInfo.jsp'
                       '?ex_ch=tse_t00.tw&json=1&delay=0&_='+str(int(now.timestamp())))
                  req=urllib.request.Request(url,headers={
                     'User-Agent':'Mozilla/5.0 DogsonRadar/1.3.6',
                     'Referer':'https://mis.twse.com.tw/stock/index.jsp',
                     'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=14) as response:
                      quotes=json.load(response).get('msgArray') or []
                  def valid(x):
                      date=str(x.get('d') or '').replace('-','').replace('/','')
                      raw=str(x.get('z') or '').replace(',','')
                      try: val=float(raw)
                      except (TypeError,ValueError):val=0
                      return date==today.replace('-','') and val>0
                  if not any(valid(x) for x in quotes):
                      print('Official MIS has no same-day completed cash session; skip')
                      sys.exit(0)
              except Exception as exc:
                  print('Official MIS session verification unavailable; fail closed',str(exc)[:180])
                  sys.exit(0)
              print('Confirmed same-day official market but published close is stale')
          generated=str(system.get('generated_at') or '')
          try:
              built=datetime.fromisoformat(generated)
              age=(now-built).total_seconds()/60 if built.tzinfo else -1
          except Exception:
              age=-1
          if age< (45 if not close_current else 95):
              print('Recent close build or missing build clock: no duplicate',round(age,1))
              sys.exit(0)
          # The called workflow has the canonical dogson-pages concurrency
          # group and date/coverage gates. This probe never writes fake data.
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('refresh=true\n')
          print('Verified lagging close or institution source; reusable close run required',today)
          PY

  recover:
    needs: check
    if: ${{ github.event_name != 'push' && needs.check.outputs.refresh == 'true' }}
    uses: ./.github/workflows/close.yml
