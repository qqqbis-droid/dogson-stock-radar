name: Radar - Evening Close Freshness Watchdog

# Independent probe. If today's verified close is published but foreign/trust
# institution sources still lag, invoke the SAME close workflow as a reusable
# job. No gh CLI/GITHUB_TOKEN API dispatch is needed.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/close-watchdog.yml"
  schedule:
    # Taiwan 19:17, 21:17, 23:17 weekdays; complements 20:30/23:40 EOD.
    - cron: "17 11,13,15 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-evening-close-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      refresh: \${{ steps.audit.outputs.refresh }}
    steps:
      - id: audit
        name: Verify current trading session and lagging source clocks
        shell: bash
        run: |
          set -euo pipefail
          echo "refresh=false" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,sys,urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now=datetime.now(ZoneInfo('Asia/Taipei'))
          if now.weekday() >= 5 or not (19 <= now.hour <= 23):
              print('Outside weekday evening recovery window')
              sys.exit(0)
          today=now.date().isoformat()
          root='https://qqqbis-droid.github.io/dogson-stock-radar/data/'
          def fetch(name):
              req=urllib.request.Request(root+name+'?eod_probe='+str(int(now.timestamp())),
                headers={'User-Agent':'Dogson-Close-Watchdog/2.0',
                         'Cache-Control':'no-cache, no-store','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=14) as r:
                  return json.load(r)
          try:
              system=fetch('system_status.json')
              chip=fetch('chip_status.json')
          except Exception as exc:
              print('Cannot read verified published data; refuse to dispatch:',str(exc)[:250])
              sys.exit(0)
          close_date=str((system.get('dates') or {}).get('close') or '')[:10]
          verified=str(system.get('latest_completed_trade_date') or '')[:10]
          if close_date!=today or verified!=today:
              print('No verified same-day close. No historical data promotion',
                {'today':today,'close':close_date,'verified':verified})
              sys.exit(0)
          source=chip.get('latest_source_dates') or {}
          foreign=str(source.get('foreign') or '')[:10]
          trust=str(source.get('trust') or '')[:10]
          print('Official-source dates',
                {'completed_close':close_date,'foreign':foreign,'trust':trust,
                 'chip':source.get('chip')})
          if foreign==today and trust==today:
              print('Both institutional sources current; no refresh needed')
              sys.exit(0)
          generated=str(system.get('generated_at') or '')
          try:
              built=datetime.fromisoformat(generated)
              age=(now-built).total_seconds()/60 if built.tzinfo else -1
          except Exception:
              age=-1
          if age<95:
              print('Recent close build or missing build clock: no duplicate',round(age,1))
              sys.exit(0)
          # The called workflow has the canonical dogson-pages concurrency
          # group and date/coverage gates. This probe never writes fake data.
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('refresh=true\n')
          print('EOD source lag verified, reusable close run required',today)
          PY

  recover:
    needs: check
    if: \${{ github.event_name != 'push' && needs.check.outputs.refresh == 'true' }}
    uses: ./.github/workflows/close.yml
