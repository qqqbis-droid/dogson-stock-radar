name: Install Radar v1.5.28 Step 7 Validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/v1528.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v1528-install
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require v1.5.27
        run: |
          grep -q 'Free Edition v1.5.27' docs/index.html
          grep -q '"dynamic_threshold_version":"1.0"' docs/data/status.json
      - name: Apply Step 7 patch
        run: python scripts/patch_v1528.py
      - name: Verify Step 7 contract
        run: |
          python -m py_compile scripts/build_data.py scripts/build_validation.py scripts/sync_live_data.py scripts/patch_v1528.py
          python - <<'PY'
          from pathlib import Path
          import json, re, importlib.util
          b=Path('scripts/build_data.py').read_text(encoding='utf-8')
          v=Path('scripts/build_validation.py').read_text(encoding='utf-8')
          h=Path('docs/index.html').read_text(encoding='utf-8')
          closewf=Path('.github/workflows/close.yml').read_text(encoding='utf-8')
          intrawf=Path('.github/workflows/intraday.yml').read_text(encoding='utf-8')
          st=json.loads(Path('docs/data/status.json').read_text(encoding='utf-8'))
          report=json.loads(Path('docs/data/validation.json').read_text(encoding='utf-8'))
          for x in ['HORIZONS = (1, 3, 5, 10)','mfe10','mae10','excess5','calibrated_weights','minimum_rows','minimum_dates']:
              if x not in v: raise SystemExit('validation engine missing '+x)
          for x in ['swing_weight_source','historical_calibration','swing_weighted_components','validation.json']:
              if x not in b: raise SystemExit('score calibration missing '+x)
          if 'build_validation.py --mode close' not in closewf or 'build_validation.py --mode intraday' not in intrawf:
              raise SystemExit('production workflows not wired')
          if 'validation_history.json' not in Path('scripts/sync_live_data.py').read_text(encoding='utf-8'):
              raise SystemExit('validation history not persisted')
          if st.get('version')!='1.5.28-free' or st.get('validation_version')!='1.0': raise SystemExit('status mismatch')
          if report.get('horizons') != [1,3,5,10]: raise SystemExit('horizon mismatch')
          if report['calibration']['active_weights'] != {'technical':50.0,'chip':25.0,'sector':15.0,'liquidity':10.0}: raise SystemExit('baseline changed during warmup')
          spec=importlib.util.spec_from_file_location('bv','scripts/build_validation.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          snaps=[]
          for i in range(11):
              snaps.append({'date':f'2026-08-{i+1:02d}','rows':[{'code':'0001','name':'T','close':100+i,'high':101+i,'low':99+i,'score':80,'category':'剛啟動','components':{'technical':40,'chip':20,'sector':12,'liquidity':8}}]})
          rec=m.outcome_records(snaps)[0]
          if set(rec['returns']) != {'1','3','5','10'} or rec['mfe10'] is None or rec['mae10'] is None: raise SystemExit('outcome maturity test failed')
          if 'Step 7｜真實結果校準' not in h or '15 個成熟交易日' not in h: raise SystemExit('validation UI missing')
          mm=re.search(r'<script>\s*(.*?)</script>\s*<script src="./hourly.js',h,re.S)
          if not mm: raise SystemExit('inline JS missing')
          Path('/tmp/dogson-inline.js').write_text(mm.group(1),encoding='utf-8')
          print('Step 7 contract OK')
          PY
          node --check /tmp/dogson-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_data.py scripts/build_validation.py scripts/sync_live_data.py .github/workflows/close.yml .github/workflows/intraday.yml docs/index.html docs/sw.js docs/data/status.json docs/data/validation.json docs/data/validation_history.json
          git diff --cached --quiet || git commit -m "Apply v1.5.28 Step 7 historical validation"
          ok=0
          for n in $(seq 1 12); do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then ok=1; break; fi
            else
              # Legacy installers may still touch old shared files. Step 7 is the newer
              # validated state, so keep this rebased commit's versions on conflicts.
              conflicted=$(git diff --name-only --diff-filter=U || true)
              if [ -n "$conflicted" ]; then
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  git checkout --theirs -- "$f"
                  git add "$f"
                done <<< "$conflicted"
                GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; sleep 3; continue; }
                if git push origin HEAD:main; then ok=1; break; fi
              else
                git rebase --abort || true
              fi
            fi
            sleep 3
          done
          test "$ok" = 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
