name: Update Radar & Deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 09:00-13:55，每 5 分鐘。GitHub 排程可能延遲。
    - cron: "*/5 1-5 * * 1-5"
    # 台灣時間約 14:20 再做一次盤後整理
    - cron: "20 6 * * 1-5"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build market data
        run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
