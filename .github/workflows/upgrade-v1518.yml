name: Install Radar v1.5.18 Explainable Stage UI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/v1518.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v1518-install
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require v1.5.17 Stage Engine 2.0
        run: |
          grep -q 'Free Edition v1.5.17' docs/index.html
          grep -q 'def _assign_stage_v2' scripts/build_data.py
          grep -q 'stage_signals' scripts/build_data.py
          grep -q 'stage_risks' scripts/build_data.py

      - name: Apply v1.5.18 explainable lifecycle UI
        run: python scripts/patch_v1518.py

      - name: Verify lifecycle explanation UI and unchanged scoring
        run: |
          python -m py_compile scripts/patch_v1518.py scripts/build_data.py
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          sw=Path('docs/sw.js').read_text(encoding='utf-8')
          build=Path('scripts/build_data.py').read_text(encoding='utf-8')
          required=[
            'Free Edition v1.5.18',
            'function stageExplainHTML(r,compact=false)',
            '🧭 生命週期判讀',
            'stage_signals',
            'stage_risks',
            '✓ ${x}',
            '⚠ ${x}',
            '${stageExplainHTML(r)}',
            '${stageExplainHTML(r,true)}',
            './sw.js?v=1518',
          ]
          for m in required:
              if m not in html:
                  raise SystemExit('missing UI marker: '+m)
          if '階段：${r.stage_reason}' in html:
              raise SystemExit('old duplicate one-line stage reason still present')
          if 'dogson-free-v1518' not in sw:
              raise SystemExit('service worker cache not bumped')
          # Stage and score formulas are untouched by this patch.
          for m in [
              'def _assign_stage_v2',
              '30 價格結構 + 25 量價/動能 + 15 相對強弱 + 20 族群 + 10 流動性/追價風險',
              '技術50＋籌碼25＋族群15＋流動性10＝100',
          ]:
              if m not in build:
                  raise SystemExit('core architecture marker missing: '+m)
          print('v1.5.18 verification OK')
          PY

      - name: Commit v1.5.18 UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sw.js
          git diff --cached --quiet || git commit -m "Apply v1.5.18 explainable lifecycle UI"
          ok=0
          for n in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true
            sleep 4
          done
          test "$ok" = 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
