name: Install Radar v1.5.13 Compact Close Flow + Members

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/v1513.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v1513-install
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require v1.5.12 money flow first
        run: |
          grep -q 'today_amount_100m' scripts/build_data.py
          grep -q 'function flowMoney(v)' docs/index.html

      - name: Apply v1.5.13 compact close flow patch
        run: python scripts/patch_v1513.py

      - name: Verify compact layout and sector member drilldown
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          sw=Path('docs/sw.js').read_text(encoding='utf-8')
          required=[
            'v1.5.13',
            'function closeSectorKey(r)',
            'function closeSectorMembers(sector)',
            'closeflowgrid compact',
            'white-space:nowrap',
            '👥 查看成分股',
            'rotationmember peerlink',
            '族群卡採固定單行數字避免換行',
            '當日估算',
            '20日估算',
          ]
          for m in required:
              if m not in html:
                  raise SystemExit('missing UI marker: '+m)
          # Existing click infrastructure and score architecture must remain intact.
          for m in ['showPeerPeek(code)',
                    '價格結構30＋量價/動能25＋相對強弱15＋族群20＋流動性/追價風險10',
                    '波段延續＝日K技術50＋籌碼25＋族群15＋流動性10']:
              if m not in html:
                  raise SystemExit('required existing marker missing: '+m)
          if 'dogson-free-v1513' not in sw:
              raise SystemExit('service worker cache not bumped')
          print('v1.5.13 compact/member drilldown verification OK')
          PY

      - name: Commit v1.5.13 UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sw.js
          git diff --cached --quiet || git commit -m "Apply v1.5.13 compact close flow and member drilldown"
          ok=0
          for n in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true
            sleep 4
          done
          test "$ok" = 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
