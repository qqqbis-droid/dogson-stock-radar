name: Clean Build 2.0 UI-only Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-ui-deploy.yml"
  workflow_run:
    workflows:
      - "Clean Build 2.0 Preview Gate"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Production composition no longer depends on short-lived Pages artifacts.
# main supplies the stable root site shell; clean-build-v2 supplies a validated,
# atomic V2 UI + data bundle. This makes UI deploys reproducible even after old
# Close/Intraday artifacts expire.
concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  deploy-v2-ui:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production root shell
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch validated V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin clean-build-v2 --depth=1
          rm -rf /tmp/v2-source
          mkdir -p /tmp/v2-source
          git archive FETCH_HEAD docs/v2 scripts/v2/validate_single_writer_ui.py scripts/v2/validate_product_surface.py scripts/v2/test_portfolio_ledger.js | tar -xf - -C /tmp/v2-source
          test -s /tmp/v2-source/docs/v2/index.html
          test -s /tmp/v2-source/docs/v2/data/current_manifest.json

      - name: Verify canonical V2 Atomic bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('/tmp/v2-source/docs/v2/data')
          m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          if m.get('schema_version') != '2.0.0':
              raise SystemExit('V2 manifest schema is not 2.0.0')
          if not m.get('health',{}).get('validation_passed'):
              raise SystemExit('V2 canonical manifest has not passed validation')
          build=str(m.get('active_build_id') or '')
          trade_date=str(m.get('trade_date') or '')[:10]
          if not build or len(trade_date) != 10:
              raise SystemExit('V2 canonical build/trade_date missing')

          required=(
              'decision_close_summary','decision_close_index','decision_close_detail',
              'stock_detail_close','zone_close','market_close_context','capital_close_context',
              'decision_intraday_summary','decision_intraday_index','decision_intraday_detail',
              'market_intraday_context','capital_intraday_context'
          )
          ds=m.get('datasets') or {}
          missing=[k for k in required if k not in ds]
          if missing:
              raise SystemExit(f'V2 canonical manifest missing datasets: {missing}')

          for key in required:
              meta=ds[key]
              raw=str(meta.get('url') or '')
              p=root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'V2 canonical dataset missing: {key} -> {p}')
              if meta.get('build_id') and meta.get('build_id') != build:
                  raise SystemExit(f'V2 canonical dataset build mismatch: {key}')

          iq=ds.get('index_quote')
          if iq:
              raw=str(iq.get('url') or '')
              p=root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
              q=json.loads(p.read_text(encoding='utf-8'))
              if str(q.get('trade_date') or '')[:10] != trade_date:
                  raise SystemExit('index_quote trade_date differs from atomic bundle')
              if q.get('build_id') and q.get('build_id') != build:
                  raise SystemExit('index_quote build mismatch')
              print('Same-build index_quote:', {k:(q.get(k) or {}).get('source') for k in ('taiex','otc')})
          else:
              print('index_quote not present yet; UI will intentionally show — instead of stale index values')

          print('Validated V2 production source:', {'build':build,'trade_date':trade_date,'datasets':len(ds)})
          PY

      - name: Compose production Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/v2
          cp -a /tmp/v2-source/docs/v2 docs/v2
          mkdir -p scripts/v2
          cp /tmp/v2-source/scripts/v2/validate_single_writer_ui.py scripts/v2/validate_single_writer_ui.py
          cp /tmp/v2-source/scripts/v2/validate_product_surface.py scripts/v2/validate_product_surface.py
          cp /tmp/v2-source/scripts/v2/test_portfolio_ledger.js scripts/v2/test_portfolio_ledger.js

          # Legacy service worker must never intercept V2/data requests.
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/sw.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              guarded="  const url=new URL(req.url);\n  if(url.pathname.includes('/v2/'))return;\n  if(url.pathname.includes('/data/'))"
              needle="  const url=new URL(req.url);\n  if(url.pathname.includes('/data/'))"
              if guarded not in s and needle in s:
                  p.write_text(s.replace(needle,guarded,1),encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate composed V2 production site
        run: |
          python scripts/v2/validate_single_writer_ui.py
          python scripts/v2/validate_product_surface.py
          node scripts/v2/test_portfolio_ledger.js
          node --check docs/v2/app.js
          node --check docs/v2/market-pulse-v2.js
          node --check docs/v2/stock-detail-renderer.js
          node --check docs/v2/price-map-v2-lite.js
          node --check docs/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
