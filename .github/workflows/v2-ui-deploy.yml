name: Clean Build 2.0 UI-only Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-ui-deploy.yml"
  workflow_run:
    workflows:
      - "Clean Build 2.0 Preview Gate"
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# UI-only deploys overlay validated V2 UI on the latest successful canonical
# Pages publisher. They never use another UI-only artifact as a data source and
# never cancel an in-flight Close / Intraday data publication.
concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  deploy-v2-ui:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find latest successful canonical Pages artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r run_id run_name run_updated <<< "$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Radar - Close Update" or .name == "Radar - Intraday Update")] | max_by(.updated_at) | [.id,.name,.updated_at] | @tsv')"
          test -n "$run_id"
          test "$run_id" != "null"
          test "$run_name" = "Radar - Close Update" -o "$run_name" = "Radar - Intraday Update"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_name=$run_name" >> "$GITHUB_OUTPUT"
          echo "run_updated=$run_updated" >> "$GITHUB_OUTPUT"
          echo "Using canonical Pages source: $run_name run=$run_id updated=$run_updated"

      - name: Download exact canonical production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .production-pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Restore canonical artifact and overlay validated V2 UI only
        shell: bash
        run: |
          set -euo pipefail
          test -s .production-pages-artifact/artifact.tar
          rm -rf .production-pages docs
          mkdir -p .production-pages
          tar -xf .production-pages-artifact/artifact.tar -C .production-pages
          mv .production-pages docs

          test -s docs/v2/data/current_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('docs/v2/data')
          m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          bundle_date=str(m.get('trade_date') or '')[:10]
          if len(bundle_date) != 10 or not m.get('health',{}).get('validation_passed'):
              raise SystemExit('canonical source manifest is not validated')
          meta=(m.get('datasets') or {}).get('decision_close_summary')
          if not meta:
              raise SystemExit('canonical source missing decision_close_summary')
          raw=str(meta.get('url') or '')
          p=root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
          rows=json.loads(p.read_text(encoding='utf-8'))
          close_date=str(meta.get('trade_date') or meta.get('as_of') or '')[:10]
          if len(close_date) != 10:
              dates=sorted({str(r.get('trade_date') or r.get('as_of') or '')[:10] for r in rows if len(str(r.get('trade_date') or r.get('as_of') or '')[:10]) == 10})
              close_date=dates[-1] if dates else ''
          if len(close_date) != 10:
              raise SystemExit('canonical source close mission date is unavailable')
          latest=[r for r in rows if str(r.get('trade_date') or r.get('as_of') or '')[:10] == close_date]
          if not latest:
              raise SystemExit(f'canonical source has no close rows for close mission date {close_date}')
          bad=[r.get('code') for r in latest if r.get('freshness') in ('STALE','UNKNOWN') or r.get('action_state')=='DATA_STALE']
          if bad:
              raise SystemExit(f'canonical source latest-close semantics regressed: {bad[:10]}')
          print('Canonical UI source verified:', {'build':m.get('active_build_id'),'bundle_date':bundle_date,'close_date':close_date,'close_rows':len(latest)})
          PY

          before_hash="$(sha256sum docs/v2/data/current_manifest.json | awk '{print $1}')"
          before_build="$(python -c 'import json; print(json.load(open("docs/v2/data/current_manifest.json")).get("active_build_id", ""))')"
          before_date="$(python -c 'import json; print(json.load(open("docs/v2/data/current_manifest.json")).get("trade_date", ""))')"
          test -n "$before_build"
          test -n "$before_date"

          rm -rf /tmp/v2-production-data /tmp/v2-ui
          mkdir -p /tmp/v2-production-data /tmp/v2-ui
          cp -a docs/v2/data/. /tmp/v2-production-data/

          git fetch origin clean-build-v2 --depth=1
          git archive FETCH_HEAD docs/v2 | tar -xf - -C /tmp/v2-ui
          rm -rf docs/v2
          mv /tmp/v2-ui/docs/v2 docs/v2
          rm -rf docs/v2/data
          mkdir -p docs/v2/data
          cp -a /tmp/v2-production-data/. docs/v2/data/

          after_hash="$(sha256sum docs/v2/data/current_manifest.json | awk '{print $1}')"
          after_build="$(python -c 'import json; print(json.load(open("docs/v2/data/current_manifest.json")).get("active_build_id", ""))')"
          after_date="$(python -c 'import json; print(json.load(open("docs/v2/data/current_manifest.json")).get("trade_date", ""))')"
          if [[ "$before_hash" != "$after_hash" || "$before_build" != "$after_build" || "$before_date" != "$after_date" ]]; then
            echo "UI-only deploy mutated canonical V2 data; refusing publish" >&2
            exit 1
          fi
          test -s docs/v2/detail-context-v3.js
          test -s docs/v2/card-display-v3.js
          grep -q 'detail-context-v3.js' docs/v2/index.html
          grep -q 'card-display-v3.js' docs/v2/index.html
          if grep -q 'detail-context-v2.js' docs/v2/index.html; then
            echo "Legacy detail-context-v2 is still active in index; refusing mixed display contracts" >&2
            exit 1
          fi
          if grep -q 'src="./quote-ui.js' docs/v2/index.html; then
            echo "Legacy quote-ui is still active in index; refusing competing card renderers" >&2
            exit 1
          fi
          grep -q 'function c3quotePayload' docs/v2/card-display-v3.js
          echo "UI-only source lock: canonical_run=${{ steps.source.outputs.run_id }} publisher=${{ steps.source.outputs.run_name }} build=$after_build trade_date=$after_date manifest_sha256=$after_hash"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate V2 UI without touching data
        run: |
          node --check docs/v2/app.js
          node --check docs/v2/stock-detail-bridge.js
          node --check docs/v2/detail-context-v3.js
          node --check docs/v2/card-display-v3.js
          node --check docs/v2/ui-coherence-v5.js
          node --check docs/v2/copy-polish-v6.js
          node --check docs/v2/market-capital-ui.js
          node --check docs/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
