name: Clean Build 2.0 UI-only Deploy
# Portfolio integrated release: 2026-10-09 verified thesis, transaction review, fees and quotes. CI gate now scopes L2-L4 limits to actual priority rows.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-ui-deploy.yml"
  workflow_run:
    workflows:
      - "Clean Build 2.0 Preview Gate"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Share one GitHub Pages deployment queue with canonical close/intraday.
  # UI-only publishes must not race and overwrite newly generated chip/60K data.
  group: dogson-pages
  # Serialize with the canonical close/intraday publishers.
  # NEVER cancel an in-progress or queued canonical close refresh; doing so
  # strands hourly60 and chip dates on the preceding trade session.
  cancel-in-progress: false

jobs:
  deploy-v2-ui:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production root shell
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preserve newest published root market data without rollback
        shell: bash
        run: |
          set -euo pipefail
          base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
          critical=(close.json market.json intraday.json hourly.json daytrade.json)
          optional=(universe.json status.json system_status.json chip_history.json chip_status.json mis_snapshots.json validation_history.json validation.json decision_history.json portfolio_reference.json)
          mkdir -p docs/data
          for name in "${critical[@]}"; do
            tmp="docs/data/${name}.live"
            if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 25 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" || ! test -s "$tmp"; then
              rm -f "$tmp"; echo "ERROR: live critical data unavailable: $name"; exit 1
            fi
            mv "$tmp" "docs/data/$name"
          done
          for name in "${optional[@]}"; do
            tmp="docs/data/${name}.live"
            if curl -fsSL --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/${name}?ts=$(date +%s%N)" -o "$tmp" && test -s "$tmp"; then
              mv "$tmp" "docs/data/$name"
            else
              rm -f "$tmp"
            fi
          done

      - name: Fetch validated V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin clean-build-v2 --depth=1
          rm -rf /tmp/v2-source && mkdir -p /tmp/v2-source
          # UI-only deploy still has to normalize the preserved Atomic bundle:
          # entry-position, ignition execution, card/detail semantics and close
          # freeze dates are data-contract semantics, not cosmetic UI state.
          git archive FETCH_HEAD docs/v2 scripts contracts requirements-contract.txt | tar -xf - -C /tmp/v2-source
          test -s /tmp/v2-source/docs/v2/index.html
          test -s /tmp/v2-source/docs/v2/data/current_manifest.json
          test -s /tmp/v2-source/scripts/v2/build_stock_shards.py
          test -s /tmp/v2-source/scripts/v2/enrich_zones.py
          test -s /tmp/v2-source/scripts/v2/normalize_close_snapshot_by_close_date.py
          test -s /tmp/v2-source/scripts/v2/validate_bundle.py
          test -s /tmp/v2-source/scripts/v2/validate_market_capital_context.py

      - name: Preserve newer published V2 market bundle
        shell: bash
        run: |
          set -euo pipefail
          live_base="https://qqqbis-droid.github.io/dogson-stock-radar/v2/data"
          rm -rf /tmp/live-v2 && mkdir -p /tmp/live-v2/data
          if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 25 -H 'Cache-Control: no-cache' "${live_base}/current_manifest.json?ts=$(date +%s%N)" -o /tmp/live-v2/data/current_manifest.json; then
            echo 'WARN: live V2 manifest unavailable; using branch V2 data'; exit 0
          fi
          use_live="$(python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def stamp(m):
              ds=m.get('datasets') or {}; vals=[]
              for key in ('decision_intraday_detail','stock_detail_intraday','decision_daytrade_detail'):
                  v=str((ds.get(key) or {}).get('as_of') or '')
                  if v: vals.append(v)
              return max(vals) if vals else str(m.get('generated_at') or '')
          live=load('/tmp/live-v2/data/current_manifest.json'); cand=load('/tmp/v2-source/docs/v2/data/current_manifest.json')
          print('yes' if stamp(live) and stamp(live)>stamp(cand) else 'no')
          PY
          )"
          if [ "$use_live" != "yes" ]; then exit 0; fi
          python - <<'PY' > /tmp/live-v2/urls.txt
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/live-v2/data/current_manifest.json').read_text(encoding='utf-8')); urls=set()
          for meta in (m.get('datasets') or {}).values():
              raw=str((meta or {}).get('url') or '')
              raw=raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./')
              if raw: urls.add(raw)
          print('\n'.join(sorted(urls)))
          PY
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "/tmp/live-v2/data/$(dirname "$rel")"
            curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -H 'Cache-Control: no-cache' "${live_base}/${rel}?ts=$(date +%s%N)" -o "/tmp/live-v2/data/${rel}"
            test -s "/tmp/live-v2/data/${rel}"
          done < /tmp/live-v2/urls.txt
          for name in market-detail.json sector-members.json; do
            curl -fsSL --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${live_base}/${name}?ts=$(date +%s%N)" -o "/tmp/live-v2/data/${name}" || rm -f "/tmp/live-v2/data/${name}"
          done
          # The current web manifest may expose only the active Build.
          # Keep the branch's previous validated same-day Build so that
          # incomplete late UI overlays cannot permanently erase ignition.
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          source=Path('/tmp/v2-source/docs/v2/data')
          published=Path('/tmp/live-v2/data')
          m=json.loads((published/'current_manifest.json').read_text(encoding='utf-8'))
          prior=str(m.get('previous_good_build_id') or '')
          if prior:
              p=source/'builds'/prior
              d=published/'builds'/prior
              if p.is_dir() and not d.exists():
                  shutil.copytree(p,d)
                  print('Preserved previous same-day ignition source',prior)
          PY
          rm -rf /tmp/v2-source/docs/v2/data
          cp -a /tmp/live-v2/data /tmp/v2-source/docs/v2/data

      - name: Rebuild V2 when canonical close/chips/hourly are newer
        shell: bash
        run: |
          set -euo pipefail
          # UI-only deployment must not overwrite a newer canonical data
          # release with a same-day but older V2 branch snapshot.
          rebuild="$(python - <<'PY'
          import json
          from pathlib import Path
          def load(p):
              try: return json.loads(Path(p).read_text(encoding='utf-8'))
              except Exception: return {}
          root=load('docs/data/system_status.json')
          m=load('/tmp/v2-source/docs/v2/data/current_manifest.json')
          rd=str((root.get('dates') or {}).get('close') or '')[:10]
          vd=str(((m.get('datasets') or {}).get('decision_close_summary') or {}).get('as_of') or '')[:10]
          rt=str(root.get('generated_at') or '')
          vt=str(m.get('generated_at') or '')
          must=bool(rd and (rd>vd or (rd==vd and rt>vt)))
          print('yes' if must else 'no')
          print(f'Canonical V2 freshness gate root_close={rd} root_generated={rt} v2_close={vd} v2_generated={vt} rebuild={must}',file=__import__('sys').stderr)
          PY
          )"
          if [ "$rebuild" = "yes" ]; then
            echo "Root market-data bundle advanced: rebuild V2 from the same root rather than publish old chip/60K layers."
            bash scripts/include_v2_pages.sh
            rm -rf /tmp/v2-source/docs/v2/data
            cp -a docs/v2/data /tmp/v2-source/docs/v2/data
          else
            echo "V2 Atomic Bundle is already as new as the canonical root."
          fi

      - name: Rebuild S/R 3.0 from newest root evidence
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/v2-source/scripts/v2/enrich_zones.py --legacy-root docs/data --output /tmp/v2-source/docs/v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v2-source/docs/v2/data'); m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          meta=(m.get('datasets') or {}).get('zone_close') or {}; raw=str(meta.get('url') or '')
          p=root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./')); zones=json.loads(p.read_text(encoding='utf-8'))
          usable=[z for z in zones if z.get('zone_id') and z.get('rank') in {'S1','S2','R1','R2'} and float(z.get('high') or 0)>0]
          print('S/R 3.0 close zones:',len(usable),'/',len(zones))
          if not usable: raise SystemExit('S/R enrichment produced no usable close zones')
          PY

      - name: Normalize completed-close semantics
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/v2-source/scripts/v2/normalize_close_snapshot_by_close_date.py --root /tmp/v2-source/docs/v2/data
          python /tmp/v2-source/scripts/v2/restore_ignition_from_previous.py --root /tmp/v2-source/docs/v2/data
          # The prior-build rescue is only a fallback. The authoritative six-part
          # CLOSE model is in the root same-session scored dataset. Match
          # dates/prices before restoring, never derive ignition from swing.
          python /tmp/v2-source/scripts/v2/restore_verified_ignition.py --root /tmp/v2-source/docs/v2/data --legacy-close docs/data/close.json
          python /tmp/v2-source/scripts/v2/enrich_stock_detail_context.py --legacy-root docs/data --root /tmp/v2-source/docs/v2/data
          python /tmp/v2-source/scripts/v2/test_capital_stock_breakdown.py
          python /tmp/v2-source/scripts/v2/build_capital_stock_breakdown.py --root /tmp/v2-source/docs/v2/data --registry /tmp/v2-source/contracts/registries/sector_registry.json
          # Never allow a new live-session rebuild to rewrite yesterday's
          # independently verified close prices, scores, zones or verdicts.
          python /tmp/v2-source/scripts/v2/preserve_frozen_close.py --root /tmp/v2-source/docs/v2/data --frozen-root /tmp/v2-source/docs/v2/frozen-close/latest
          python /tmp/v2-source/scripts/v2/validate_bundle.py --root /tmp/v2-source/docs/v2/data
          python /tmp/v2-source/scripts/v2/validate_market_capital_context.py --root /tmp/v2-source/docs/v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v2-source/docs/v2/data')
          m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          def resolve(meta):
              raw=str((meta or {}).get('url') or '')
              return root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
          idx=json.loads(resolve(m['datasets']['decision_close_index']).read_text(encoding='utf-8'))
          det=json.loads(resolve(m['datasets']['decision_close_detail']).read_text(encoding='utf-8')).get('items') or {}
          mismatches=[]
          for row in idx:
              code=str(row.get('code') or '')
              d=det.get(code)
              if not d: continue
              a=row.get('scores') or {}; b=d.get('scores') or {}
              for key in ('entry_position_score','ignition_score'):
                  if a.get(key)!=b.get(key):
                      mismatches.append(f'{code}:{key}:{a.get(key)}!={b.get(key)}')
              for key in ('ignition_action','ignition_execution_state','ignition_execution_ready'):
                  if row.get(key)!=d.get(key):
                      mismatches.append(f'{code}:{key}:{row.get(key)}!={d.get(key)}')
          if mismatches:
              raise SystemExit('close card/detail mismatch after normalization: '+', '.join(mismatches[:20]))
          scored=[r for r in idx if isinstance((r.get('scores') or {}).get('ignition_score'), (int,float)) and r.get('ignition_model_version')=='inuko-ignition-v2.0' and r.get('ignition_rank') is not None]
          if len(scored)<max(10,int(len(idx)*0.60)):
              raise SystemExit(f'Ignition production gate: only {len(scored)}/{len(idx)} rows carry scored validated 2.0 data')
          summary=json.loads(resolve(m['datasets']['decision_close_summary']).read_text(encoding='utf-8'))
          if not summary or any(not isinstance((r.get('scores') or {}).get('ignition_score'), (int,float)) for r in summary):
              raise SystemExit('Ignition production gate: close summary still contains blank ignition score')
          print('Close card/detail semantic parity OK', {'rows':len(idx),'details':len(det),'ignition_scored':len(scored)})
          PY

      - name: Add official full-market portfolio close quotes
        shell: bash
        run: |
          set -euo pipefail
          # Independent of the liquidity-filtered swing radar. Official market
          # dates remain attached to every quote; this never manufactures scores.
          # One exchange may deliver only a partial official close today.
          # Preserve ONLY same-session validated official prices.
          prior=/tmp/portfolio-quotes-prior.json
          curl -fsSL --retry 2 --retry-delay 1 --max-time 14 -H 'Cache-Control: no-cache' \
            "https://qqqbis-droid.github.io/dogson-stock-radar/v2/data/portfolio_market_quotes.json?prior_run=${GITHUB_RUN_ID}" \
            -o "$prior" || rm -f "$prior"
          python /tmp/v2-source/scripts/v2/portfolio_quote_fallback.py \
            --out /tmp/v2-source/docs/v2/data/portfolio_market_quotes.json --prior "$prior" --close-json docs/data/close.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v2-source/docs/v2/data/portfolio_market_quotes.json')
          if p.exists():
              q=json.loads(p.read_text(encoding='utf-8'))
              print('Portfolio official quotes:',len(q.get('quotes') or {}),'5302:',(q.get('quotes') or {}).get('5302'))
          PY

      - name: Verify canonical V2 Atomic bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v2-source/docs/v2/data'); m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          if m.get('schema_version')!='2.0.0': raise SystemExit('V2 manifest schema is not 2.0.0')
          if not m.get('health',{}).get('validation_passed'): raise SystemExit('V2 canonical manifest has not passed validation')
          build=str(m.get('active_build_id') or ''); trade_date=str(m.get('trade_date') or '')[:10]
          if not build or len(trade_date)!=10: raise SystemExit('V2 canonical build/trade_date missing')
          required=('decision_close_summary','decision_close_index','decision_close_detail','stock_detail_close','zone_close','market_close_context','capital_close_context','decision_intraday_summary','decision_intraday_index','decision_intraday_detail','market_intraday_context','capital_intraday_context')
          ds=m.get('datasets') or {}; missing=[k for k in required if k not in ds]
          if missing: raise SystemExit(f'V2 canonical manifest missing datasets: {missing}')
          for key in required:
              meta=ds[key]; raw=str(meta.get('url') or ''); p=root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
              if not p.is_file() or p.stat().st_size==0: raise SystemExit(f'V2 canonical dataset missing: {key}')
              if meta.get('build_id') and meta.get('build_id')!=build: raise SystemExit(f'V2 dataset build mismatch: {key}')
          print('Validated V2 production source:',{'build':build,'trade_date':trade_date,'datasets':len(ds)})
          PY

      - name: Build mobile-safe single-stock shards
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/v2-source/scripts/v2/build_stock_shards.py --data-root /tmp/v2-source/docs/v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v2-source/docs/v2/data'); m=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          p=root/'builds'/m['active_build_id']/'stock-shards'/'index.json'; x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('build_id')!=m['active_build_id'] or int(x.get('total_files') or 0)<=0: raise SystemExit('single-stock shard build invalid')
          close=x.get('views',{}).get('close',{})
          if int(close.get('files') or 0) and int(close.get('shards_with_zones') or 0)<=0: raise SystemExit('close shards contain no S/R zones')
          print('Mobile stock shards:',x)
          PY

      - name: Compose production Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/v2; cp -a /tmp/v2-source/docs/v2 docs/v2; mkdir -p scripts/v2
          cp /tmp/v2-source/scripts/v2/validate_single_writer_ui.py scripts/v2/validate_single_writer_ui.py
          cp /tmp/v2-source/scripts/v2/validate_product_surface.py scripts/v2/validate_product_surface.py
          cp /tmp/v2-source/scripts/v2/test_portfolio_ledger.js scripts/v2/test_portfolio_ledger.js
          cp /tmp/v2-source/scripts/v2/test_search_focus_stability.cjs scripts/v2/test_search_focus_stability.cjs
          cp /tmp/v2-source/scripts/v2/test_intraday_quote_recovery.cjs scripts/v2/test_intraday_quote_recovery.cjs
          cp /tmp/v2-source/scripts/v2/test_close_plan_progressive.cjs scripts/v2/test_close_plan_progressive.cjs
          cp /tmp/v2-source/scripts/v2/test_swing_path_evidence.cjs scripts/v2/test_swing_path_evidence.cjs
          cp /tmp/v2-source/scripts/v2/restore_ignition_from_previous.py scripts/v2/restore_ignition_from_previous.py
          cp /tmp/v2-source/scripts/v2/test_ignition_restore.py scripts/v2/test_ignition_restore.py
          cp /tmp/v2-source/scripts/v2/restore_verified_ignition.py scripts/v2/restore_verified_ignition.py
          cp /tmp/v2-source/scripts/v2/test_verified_ignition_rehydration.py scripts/v2/test_verified_ignition_rehydration.py
          cp /tmp/v2-source/scripts/v2/legacy_adapter.py scripts/v2/legacy_adapter.py
          cp /tmp/v2-source/scripts/v2/engine.py scripts/v2/engine.py
          cp /tmp/v2-source/scripts/v2/test_portfolio_progressive_quotes.cjs scripts/v2/test_portfolio_progressive_quotes.cjs
          cp /tmp/v2-source/scripts/v2/test_portfolio_pl_dual.cjs scripts/v2/test_portfolio_pl_dual.cjs
          cp /tmp/v2-source/scripts/v2/test_portfolio_pl_persistence.cjs scripts/v2/test_portfolio_pl_persistence.cjs
          cp /tmp/v2-source/scripts/v2/test_portfolio_l_edge_sync.cjs scripts/v2/test_portfolio_l_edge_sync.cjs
          cp /tmp/v2-source/scripts/v2/test_intraday_quote_display.cjs scripts/v2/test_intraday_quote_display.cjs
          cp /tmp/v2-source/scripts/v2/test_live_rank_safety.cjs scripts/v2/test_live_rank_safety.cjs
          cp /tmp/v2-source/scripts/v2/live_publish_patch.py scripts/v2/live_publish_patch.py
          cp /tmp/v2-source/scripts/v2/validate_mission_evidence.py scripts/v2/validate_mission_evidence.py
          cp /tmp/v2-source/scripts/v2/test_live_truth_gate.py scripts/v2/test_live_truth_gate.py
          cp /tmp/v2-source/scripts/v2/test_portfolio_quote_preservation.py scripts/v2/test_portfolio_quote_preservation.py
          cp /tmp/v2-source/scripts/v2/test_verified_sector_flow.cjs scripts/v2/test_verified_sector_flow.cjs
          cp /tmp/v2-source/scripts/v2/portfolio_quote_fallback.py scripts/v2/portfolio_quote_fallback.py
          cp /tmp/v2-source/scripts/v2/test_close_zone_card_evidence.cjs scripts/v2/test_close_zone_card_evidence.cjs
          cp /tmp/v2-source/scripts/v2/build_stock_shards.py scripts/v2/build_stock_shards.py
          cp /tmp/v2-source/scripts/v2/enrich_zones.py scripts/v2/enrich_zones.py
          cp /tmp/v2-source/scripts/v2/build_capital_stock_breakdown.py scripts/v2/build_capital_stock_breakdown.py
          cp /tmp/v2-source/scripts/v2/normalize_close_snapshot_by_close_date.py scripts/v2/normalize_close_snapshot_by_close_date.py
          cp /tmp/v2-source/scripts/v2/normalize_close_snapshot.py scripts/v2/normalize_close_snapshot.py
          cp /tmp/v2-source/scripts/v2/close_semantics_v5.py scripts/v2/close_semantics_v5.py
          cp /tmp/v2-source/scripts/v2/rebuild_close_rank_views.py scripts/v2/rebuild_close_rank_views.py
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/sw.js')
          if p.exists():
              s=p.read_text(encoding='utf-8'); guarded="  const url=new URL(req.url);\n  if(url.pathname.includes('/v2/'))return;\n  if(url.pathname.includes('/data/'))"; needle="  const url=new URL(req.url);\n  if(url.pathname.includes('/data/'))"
              if guarded not in s and needle in s: p.write_text(s.replace(needle,guarded,1),encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate composed V2 production site
        run: |
          python scripts/v2/validate_single_writer_ui.py
          python scripts/v2/validate_product_surface.py
          node scripts/v2/test_portfolio_ledger.js
          python -m py_compile scripts/v2/build_stock_shards.py scripts/v2/enrich_zones.py /tmp/v2-source/scripts/v2/preserve_frozen_close.py
          node --check docs/v2/app.js
          node --check docs/v2/intraday-quote-recovery-v2.js
          grep -q 'intraday-quote-recovery-v2.js?v=20261013recovery1' docs/v2/index.html
          node --check docs/v2/market-pulse-v2.js
          grep -q 'market-pulse-v2.js?v=20261012partial1' docs/v2/index.html
          node --check docs/v2/stock-detail-renderer.js
          node --check docs/v2/detail-loading-guard-v1.js
          node --check docs/v2/detail-loading-guard-v2.js
          grep -q 'detail-loading-guard-v2.js?v=20261016route1' docs/v2/index.html
          grep -q 'chip_check_health' docs/v2/detail-loading-guard-v2.js
          grep -q 'activeDetail' docs/v2/detail-loading-guard-v2.js
          grep -q 'foreign_date' docs/v2/detail-loading-guard-v2.js
          grep -q 'trust_date' docs/v2/detail-loading-guard-v2.js
          grep -q 'sbl_date' docs/v2/detail-loading-guard-v2.js
          grep -q 'margin_date' docs/v2/detail-loading-guard-v2.js
          grep -q 'InukoCloseOps?.analyze' docs/v2/detail-loading-guard-v2.js
          node --check docs/v2/price-map-v2-lite.js
          node --check docs/v2/portfolio-store.js
          node --check docs/v2/portfolio-fees.js
          node --check docs/v2/portfolio-renderer.js
          grep -q 'await data(positions,paint)' docs/v2/portfolio-renderer.js
          grep -q 'portfolio-renderer.js?v=20261015plpersist3' docs/v2/index.html
          grep -q 'localFirst(positions,{loading:true})' docs/v2/portfolio-renderer.js
