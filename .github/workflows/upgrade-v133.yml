name: Install Radar v1.3.3 Official Foreign Flow

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Install v1.3.3 official foreign flow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Apply v1.3.3 official foreign-flow patch
        run: python scripts/patch_v133.py

      - name: Preserve live data and rebuild close market score
        run: |
          python scripts/sync_live_data.py || true
          python scripts/build_data.py --mode close
          python scripts/build_data.py --mode intraday || true

      - name: Verify official foreign-flow fields and UI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          m = json.loads(Path('docs/data/market.json').read_text(encoding='utf-8'))
          assert 'Free Edition v1.3.3' in h
          assert '外資現貨' in h
          assert 'foreign_net_billion' in m
          assert 'foreign_twse_billion' in m
          assert 'foreign_tpex_billion' in m
          assert 'foreign_5d_billion' in m
          assert 'foreign_score' in m
          assert 'foreign_net_lots' not in m
          print('foreign_date=', m.get('foreign_date'))
          print('foreign_net_billion=', m.get('foreign_net_billion'))
          print('foreign_twse_billion=', m.get('foreign_twse_billion'))
          print('foreign_tpex_billion=', m.get('foreign_tpex_billion'))
          print('foreign_5d_billion=', m.get('foreign_5d_billion'))
          print('foreign_score=', m.get('foreign_score'))
          PY

      - name: Commit source/UI upgrade
        run: |
          git config user.name "qqqbis-droid"
          git config user.email "qqqbis@gmail.com"
          git add scripts/build_data.py docs/index.html
          git diff --cached --quiet || git commit -m "Apply v1.3.3 official market foreign flow"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
