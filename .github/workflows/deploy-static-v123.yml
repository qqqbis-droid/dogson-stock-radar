name: Legacy Radar v1.2.3 Static (manual only)

# Historical recovery workflow only. It must never participate in normal
# production pushes, because v1.7.1 is now the canonical production pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Sync newest live data before legacy recovery deploy
        run: python scripts/sync_live_data.py || true
      - name: Rebuild intraday snapshot before legacy recovery deploy
        run: python scripts/build_data.py --mode intraday
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
