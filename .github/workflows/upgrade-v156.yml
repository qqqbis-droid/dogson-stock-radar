name: Install Radar v1.5.6 Intraday Sector Drilldown

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-v156.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v156-install
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v1.5.6 sector drilldown patch
        run: python scripts/patch_v156.py

      - name: Verify sector drilldown wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          sw=Path('docs/sw.js').read_text(encoding='utf-8')
          markers=[
              'v1.5.6',
              'rotationgroup',
              'rotationmembers',
              'rotationmember peerlink',
              '.filter(r=>(r.sector_group||"").trim()===(x.sector||"").trim())',
              '查看族群 ${members.length} 檔',
              'data-code="${r.code}"',
              'showPeerPeek(code)',
          ]
          for m in markers:
              if m not in html:
                  raise SystemExit('missing marker: '+m)
          if 'dogson-free-v156' not in sw:
              raise SystemExit('service worker cache not bumped')
          print('v1.5.6 sector drilldown verification OK')
          PY

      - name: Commit v1.5.6 UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sw.js
          git diff --cached --quiet || git commit -m "Apply v1.5.6 intraday sector drilldown"
          ok=0
          for n in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true
            sleep 4
          done
          test "$ok" = 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
