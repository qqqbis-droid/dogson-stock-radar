name: Radar - Close Update

# Production refresh marker: canonical metadata + latest valid trading day rebuild.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sector_groups.py"
      - "scripts/chip_data.py"
      - "scripts/build_data.py"
      - "requirements.txt"
      - "scripts/build_hourly.py"
      - "scripts/enrich_sr_structure.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "scripts/build_completion.py"
      - "scripts/build_close_fresh.py"
      - "scripts/build_system_status.py"
      - "scripts/include_v2_pages.sh"
      - ".github/workflows/close.yml"
      - "docs/hourly.js"
  schedule:
    # 台灣時間：14:25 先出盤後版；20:30 / 23:40 補晚公布籌碼；次日 08:15 再做一次最終補齊。
    - cron: "25 6 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "40 15 * * 1-5"
    - cron: "15 0 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Verify Sector Taxonomy 2.1 resolver
        run: |
          python - <<'PY'
          from scripts.sector_groups import taxonomy_stats, classification_for
          stats=taxonomy_stats()
          print('sector taxonomy:', stats)
          if stats.get('taxonomy_version') != '2.1.0':
              raise SystemExit('Sector Taxonomy version mismatch')
          if int(stats.get('eligible_primary_codes') or 0) < 200:
              raise SystemExit('Sector Taxonomy coverage unexpectedly low')
          if classification_for('2379', industry='24').get('primary_group') != 'IC設計':
              raise SystemExit('Cross-sector primary classification regression')
          PY
      - name: Keep last live intraday/hourly data if available
        run: python scripts/sync_live_data.py || true
      - name: Build full close + chips + market with latest-session guard
        run: python scripts/build_close_fresh.py

      - name: Try to refresh lagging intraday/daytrade snapshot
        shell: bash
        run: |
          set -euo pipefail
          need_refresh="$(python - <<'PY'
          import json
          from pathlib import Path
          def date_of(path, *keys):
              p=Path(path)
              if not p.exists(): return ''
              try: obj=json.loads(p.read_text(encoding='utf-8'))
              except Exception: return ''
              vals=[]
              for key in keys:
                  s=str(obj.get(key) or '')[:10]
                  if len(s)==10: vals.append(s)
              bridge=obj.get('bridge') or {}
              s=str(bridge.get('trade_date') or '')[:10]
              if len(s)==10: vals.append(s)
              for r in obj.get('rows') or []:
                  if not isinstance(r,dict): continue
                  s=str(r.get('quote_date') or r.get('market_trade_date') or r.get('date') or '')[:10]
                  if len(s)==10: vals.append(s)
              return max(vals) if vals else ''
          close=date_of('docs/data/close.json','trade_date','source_trade_date','date')
          intra=date_of('docs/data/intraday.json','trade_date','source_trade_date','date')
          day=date_of('docs/data/daytrade.json','trade_date','source_trade_date','date')
          refresh=bool(close) and (not intra or intra < close or not day or day < close)
          print('1' if refresh else '0')
          print(f'close={close} intraday={intra} daytrade={day}', file=__import__('sys').stderr)
          PY
          )"
          if [[ "$need_refresh" == "1" ]]; then
            echo "Latest close is newer than root intraday/daytrade; attempting official MIS fast repair first."
            if ! python scripts/run_bridge_intraday_fast.py; then
              echo "Official MIS fast repair failed; falling back to legacy bridge."
              python scripts/bridge_intraday.py || true
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/intraday.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          rows=[r for r in (obj.get('rows') or []) if isinstance(r,dict)]
          bridge=obj.get('bridge') or {}; qlayer=obj.get('quote_layer') or {}
          dates=[]
          for v in (bridge.get('trade_date'), obj.get('trade_date')):
              s=str(v or '')[:10]
              if len(s)==10: dates.append(s)
          for r in rows:
              s=str(r.get('quote_date') or r.get('market_trade_date') or r.get('date') or '')[:10]
              if len(s)==10: dates.append(s)
          if dates:
              effective=max(dates)
              clocks=[]
              for v in (bridge.get('latest_quote_time'), qlayer.get('latest_time'), bridge.get('latest_trade_time'), qlayer.get('latest_trade_time')):
                  s=str(v or '').strip()
                  if ':' in s: clocks.append(s[:8] if len(s)>=8 else s[:5]+':00')
              for r in rows:
                  if str(r.get('quote_date') or '')[:10] != effective: continue
                  for k in ('quote_snapshot_time','quote_time','structure_time'):
                      s=str(r.get(k) or '').strip()
                      if ':' in s: clocks.append(s[:8] if len(s)>=8 else s[:5]+':00')
              latest=max(clocks) if clocks else '13:30:00'; as_of=f'{effective}T{latest}+08:00'
              obj['trade_date']=effective; obj['source_trade_date']=effective; obj['as_of']=as_of; obj['source_updated_at']=as_of
              p.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print('close refresh intraday normalized:', effective, as_of, 'rows=',len(rows))
          PY
            python scripts/build_daytrade.py
            python - <<'PY'
          import json
          from pathlib import Path
          ip=Path('docs/data/intraday.json'); dp=Path('docs/data/daytrade.json')
          intra=json.loads(ip.read_text(encoding='utf-8')); day=json.loads(dp.read_text(encoding='utf-8'))
          td=str(intra.get('trade_date') or '')[:10]; asof=str(intra.get('as_of') or '')
          if len(td)==10 and asof.startswith(td):
              day['trade_date']=td; day['source_trade_date']=td; day['as_of']=asof; day['source_updated_at']=asof
              dp.write_text(json.dumps(day,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print('close refresh daytrade normalized:', td, asof)
          PY
          else
            echo "Root intraday/daytrade are already aligned with latest close."
          fi

      - name: Build 60m lifecycle + entry-position lights
        run: python scripts/build_hourly.py
      - name: Enrich support resistance structure 2.0
        run: python scripts/enrich_sr_structure.py
      - name: Archive signals + resolve real outcomes
        run: python scripts/build_validation.py --mode close
      - name: Build canonical data status
        run: python scripts/build_system_status.py
      - name: Verify chip, 60K and canonical status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_system_status import APP_VERSION

          p = Path('docs/data/close.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          rows = obj.get('rows') or []
          covered = [r for r in rows if float(r.get('chip_coverage_pct') or 0) > 0]
          print('chip covered rows:', len(covered), '/', len(rows))
          if rows and not covered:
              raise SystemExit('chip coverage is still 0% for all rows')

          chip2=[r for r in rows if r.get('chip_model_version')=='inuko-chip-v2.0' and isinstance(r.get('chip_components_v2'),dict)]
          tech2=[r for r in rows if r.get('technical_model_version')=='inuko-tech-v2.0' and isinstance(r.get('technical_components_v2'),dict)]
          sector2=[r for r in rows if r.get('sector_model_version')=='inuko-sector-v2.0' and isinstance(r.get('sector_components_v2'),dict)]
          liquidity2=[r for r in rows if r.get('liquidity_model_version')=='inuko-liquidity-v2.0' and isinstance(r.get('liquidity_components_v2'),dict)]
          ignition2=[r for r in rows if r.get('ignition_model_version')=='inuko-ignition-v2.0' and isinstance(r.get('ignition_components_v2'),dict)]
          print('chip2 rows:',len(chip2),'/',len(rows),'tech2 rows:',len(tech2),'/',len(rows),'sector2 rows:',len(sector2),'/',len(rows),'liquidity2 rows:',len(liquidity2),'/',len(rows),'ignition2 rows:',len(ignition2),'/',len(rows))
          if rows and len(chip2) != len(rows):
              raise SystemExit(f'chip score 2.0 missing from {len(rows)-len(chip2)} close rows')
          if rows and len(tech2) != len(rows):
              raise SystemExit(f'technical score 2.0 missing from {len(rows)-len(tech2)} close rows')
          if rows and len(sector2) != len(rows):
              raise SystemExit(f'sector score 2.0 missing from {len(rows)-len(sector2)} close rows')
          if rows and len(liquidity2) != len(rows):
              raise SystemExit(f'liquidity score 2.0 missing from {len(rows)-len(liquidity2)} close rows')
          if rows and len(ignition2) != len(rows):
              raise SystemExit(f'ignition score 2.0 missing from {len(rows)-len(ignition2)} close rows')

          def fnum(v):
              try:
                  return float(v)
              except Exception:
                  return None

          bad_math=[]
          for r in rows:
              code=str(r.get('code') or '')
              tparts=r.get('technical_components_v2') or {}
              tvals=[fnum((tparts.get(k) or {}).get('score')) for k in ('trend','breakout','volume_price','momentum','relative','risk_quality')]
              tscore=fnum(r.get('technical_score_v2'))
              if tscore is None or any(v is None for v in tvals) or abs(sum(tvals)-tscore)>0.11:
                  bad_math.append(f'{code}:technical:{tvals}->{tscore}')

              cparts=r.get('chip_components_v2') or {}
              cvals=[fnum((cparts.get(k) or {}).get('points')) for k in ('foreign','trust','sbl','margin','consensus','price_chip','sector_inst')]
              craw=fnum(r.get('chip_score_v2_raw'))
              cscore=fnum(r.get('chip_score_v2'))
              if craw is None or cscore is None or any(v is None for v in cvals) or abs(sum(cvals)-craw)>0.11 or abs(craw/4.0-cscore)>0.11:
                  bad_math.append(f'{code}:chip:{cvals}->{craw}/100->{cscore}/25')

              sparts=r.get('sector_components_v2') or {}
              svals=[fnum((sparts.get(k) or {}).get('score')) for k in ('breadth','leaders','persistence','capital_resonance','structure','taxonomy')]
              sscore=fnum(r.get('sector_score_v2'))
              if sscore is None or any(v is None for v in svals) or abs(sum(svals)-sscore)>0.11:
                  bad_math.append(f'{code}:sector:{svals}->{sscore}/15')

              lparts=r.get('liquidity_components_v2') or {}
              lvals=[fnum((lparts.get(k) or {}).get('score')) for k in ('avg_turnover','stability','price_impact','continuity','crowding')]
              lscore=fnum(r.get('liquidity_score_v2'))
              if lscore is None or any(v is None for v in lvals) or abs(sum(lvals)-lscore)>0.11:
                  bad_math.append(f'{code}:liquidity:{lvals}->{lscore}/10')

              iparts=r.get('ignition_components_v2') or {}
              ivals=[fnum((iparts.get(k) or {}).get('score')) for k in ('structure','volume_acceleration','sector_resonance','relative_acceleration','chip_acceleration','tradability_risk')]
              iraw=fnum(r.get('ignition_raw_score_v2')); iscore=fnum(r.get('ignition_score_v2')); icap=fnum(r.get('ignition_gate_cap_v2'))
              imaxs=[fnum((iparts.get(k) or {}).get('max')) for k in ('structure','volume_acceleration','sector_resonance','relative_acceleration','chip_acceleration','tradability_risk')]
              if iraw is None or iscore is None or icap is None or any(v is None for v in ivals+imaxs):
                  bad_math.append(f'{code}:ignition:missing')
              elif abs(sum(ivals)-iraw)>0.11 or abs(sum(imaxs)-100.0)>0.11 or iscore-iraw>0.11 or iscore-icap>0.11:
                  bad_math.append(f'{code}:ignition:{ivals}->{iraw} cap={icap} final={iscore}')

              sw=r.get('swing_components') or {}
              expected=(fnum(r.get('technical_score_v2')),fnum(r.get('chip_score_v2')),sscore,lscore)
              actual=tuple(fnum(sw.get(k)) for k in ('technical','chip','sector','liquidity'))
              if any(v is None for v in expected+actual) or any(abs(a-b)>0.11 for a,b in zip(expected,actual)):
                  bad_math.append(f'{code}:swing_components:{actual}->{expected}')
          print('score v2 math checked:',len(rows),'bad=',len(bad_math))
          if bad_math:
              raise SystemExit(f'score v2 explanation math mismatch {bad_math[:20]}')

          formula=obj.get('score_formula') or {}
          if float(formula.get('technical') or 0) != 50 or float(formula.get('chip') or 0) != 25:
              raise SystemExit(f'fixed score contract drifted: {formula}')
          if formula.get('technical_model') != 'inuko-tech-v2.0' or formula.get('chip_model') != 'inuko-chip-v2.0' or formula.get('sector_model') != 'inuko-sector-v2.0' or formula.get('liquidity_model') != 'inuko-liquidity-v2.0':
              raise SystemExit(f'v2 score model metadata missing: {formula}')

          structured=[r for r in rows if (r.get('support_levels') or r.get('resistance_levels'))]
          print('SR 2.0 structured rows:',len(structured),'/',len(rows))
          if rows and not structured:
              raise SystemExit('SR 2.0 produced no structured rows')

          h = Path('docs/data/hourly.json')
          hj = json.loads(h.read_text(encoding='utf-8')) if h.exists() else {}
          hrows = hj.get('rows') or []
          print('60K rows:', len(hrows), 'lights:', hj.get('entry_light_counts'))
          if not hrows:
              raise SystemExit('60K radar is empty; abort Pages deploy instead of publishing a blank panel')

          s = json.loads(Path('docs/data/system_status.json').read_text(encoding='utf-8'))
          print('system status:', s)
          if s.get('app_version') != APP_VERSION:
              raise SystemExit(f"canonical system status app_version mismatch: {s.get('app_version')} != {APP_VERSION}")
          if not s.get('latest_completed_trade_date'):
              raise SystemExit('latest_completed_trade_date missing')
          dates=s.get('dates') or {}
          close_date=str(dates.get('close') or '')[:10]
          intraday_date=str(dates.get('intraday') or '')[:10]
          daytrade_date=str(dates.get('daytrade') or '')[:10]
          if close_date and (intraday_date < close_date or daytrade_date < close_date):
              raise SystemExit(
                  'Refusing close publish with stale root intraday/daytrade: '
                  f'close={close_date} intraday={intraday_date} daytrade={daytrade_date}'
              )
          PY
      - name: Include Clean Build 2.0 in Pages artifact
        run: |
          bash scripts/include_v2_pages.sh
          node --check docs/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
