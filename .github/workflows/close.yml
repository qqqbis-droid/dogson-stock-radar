name: Radar - Close Update

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # 台灣時間週一至週五約 14:25
    - cron: "25 6 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Keep last live intraday data if available
        run: python scripts/sync_live_data.py || true
      - name: Build full close + chips + market
        run: python scripts/build_data.py --mode close
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
