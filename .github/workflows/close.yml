name: Radar - Close Update

# Production refresh marker: keep the 60K lifecycle/entry-light deployment newer than installer workflows.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/chip_data.py"
      - "scripts/build_hourly.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "docs/hourly.js"
      - "docs/realtime-config.js"
      - ".github/workflows/close.yml"
  schedule:
    # 台灣時間：14:25 先出盤後版；20:30 / 23:40 補晚公布籌碼；次日 08:15 再做一次最終補齊。
    - cron: "25 6 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "40 15 * * 1-5"
    - cron: "15 0 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# 籌碼補抓不可被其他 Pages 更新互相取消；否則會出現程式已修正、資料卻永遠沒重建的狀況。
concurrency:
  group: dogson-close-pages
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Keep last live intraday/hourly data if available
        run: python scripts/sync_live_data.py || true
      - name: Build full close + chips + market
        run: python scripts/build_data.py --mode close
      - name: Build 60m lifecycle + entry-position lights
        run: python scripts/build_hourly.py
      - name: Step 7 archive signals + resolve real outcomes
        run: python scripts/build_validation.py --mode close
      - name: Verify chip and 60K recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/data/close.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          rows = obj.get('rows') or []
          covered = [r for r in rows if float(r.get('chip_coverage_pct') or 0) > 0]
          print('chip covered rows:', len(covered), '/', len(rows))
          x = next((r for r in rows if str(r.get('code')) == '5483'), None)
          if x:
            keys = ['chip_date','foreign_net_latest','foreign_3d_net','trust_net_latest','sbl_balance_latest','sbl_3change_pct','margin_3d_pct','margin_status','chip_coverage_pct','chip_history_days']
            print('5483:', {k:x.get(k) for k in keys})
          if rows and not covered:
            raise SystemExit('chip coverage is still 0% for all rows')
          h = Path('docs/data/hourly.json')
          hj = json.loads(h.read_text(encoding='utf-8')) if h.exists() else {}
          hrows = hj.get('rows') or []
          print('60K rows:', len(hrows), 'lights:', hj.get('entry_light_counts'))
          if not hrows:
            raise SystemExit('60K radar is empty; abort Pages deploy instead of publishing a blank panel')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
