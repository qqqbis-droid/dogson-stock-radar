name: Radar - Intraday Update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_data.py"
      - "scripts/bridge_intraday.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "scripts/build_daytrade.py"
      - "scripts/build_completion.py"
      - "docs/index.html"
      - "docs/realtime.js"
      - "docs/realtime-config.js"
      - "docs/ui-filters.js"
      - "api/quote.js"
      - ".github/workflows/intraday.yml"
  schedule:
    # 台灣時間約 09:00~13:59；GitHub cron 可能延遲數分鐘。
    - cron: "*/5 1-5 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: true

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Download last close/chip/bridge data from live Pages
        run: python scripts/sync_live_data.py || true
      - name: Build 5-minute radar base
        run: python scripts/build_data.py --mode intraday
      - name: Bridge delayed 5-minute tail with TWSE MIS snapshots
        run: python scripts/bridge_intraday.py
      - name: v1.5.30 enrich swing decision details
        run: python scripts/build_completion.py --mode intraday
      - name: Step 8 build isolated day-trading radar
        run: python scripts/build_daytrade.py
      - name: Step 7 preserve source intraday scan for future validation
        run: python scripts/build_validation.py --mode intraday
      - name: Verify intraday freshness and Step 8 isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/data/intraday.json')
          o = json.loads(p.read_text(encoding='utf-8'))
          b = o.get('bridge') or {}
          print('bridge=', b)
          if not b.get('bridged_rows'):
              raise SystemExit('MIS bridge produced no bridged rows')
          if o.get('completion_version') is None:
              raise SystemExit('v1.5.30 completion layer missing')
          d = json.loads(Path('docs/data/daytrade.json').read_text(encoding='utf-8'))
          iso = d.get('isolation') or {}
          if not d.get('rows'):
              raise SystemExit('daytrade radar is empty')
          if any(bool(iso.get(k)) for k in ['writes_intraday','changes_stage2','changes_swing_score','changes_intraday_score']):
              raise SystemExit('Step 8 isolation contract violated')
          print('quote_time=', b.get('latest_quote_time'), 'structure_time=', b.get('latest_structure_time'), 'daytrade=', len(d.get('rows') or []), 'completion=', o.get('completion_version'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
