name: Radar - Intraday Update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sector_groups.py"
      - "scripts/build_data.py"
      - "scripts/bridge_intraday.py"
      - "scripts/bridge_intraday_fast.py"
      - "scripts/run_bridge_intraday_fast.py"
      - "scripts/run_bridge_intraday_deep_fastmis.py"
      - "scripts/normalize_intraday_clock.py"
      - "scripts/enrich_sr_structure.py"
      - "scripts/validate_intraday_fast_publish.py"
      - "scripts/publish_v2_companions.py"
      - "scripts/verify_v2_intraday.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "scripts/build_daytrade.py"
      - "scripts/build_completion.py"
      - "scripts/build_system_status.py"
      - "scripts/validate_intraday_publish.py"
      - "scripts/include_v2_pages.sh"
      - "scripts/include_v2_intraday_fast.sh"
      - "docs/index.html"
      - "docs/realtime.js"
      - "docs/ui-filters.js"
      - "api/quote.js"
      - ".github/workflows/intraday.yml"
  schedule:
    # Fast quote lane: 台灣時間約 09:00~13:59，每 5 分鐘抓官方 MIS。
    - cron: "*/5 1-5 * * 1-5"
    # Structure lane: 盤中每 10 分鐘重建 Yahoo 5m + MIS bridge；刻意錯開快線 2 分鐘。
    - cron: "2,12,22,32,42,52 1-4 * * 1-5"
    - cron: "2,12,22 5 * * 1-5"
    # Final audit: 台灣時間 14:10，再重建 60 分K與歷史驗證。
    - cron: "10 6 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# All Pages publishers share the same single-writer group. Intraday ticks may
# replace an older *pending* tick, but must never cancel a running close/audit
# publisher; otherwise the latest-completed-session background can never finish.
# Recovery note: a [deep] workflow-file push intentionally runs the audit lane.
concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Verify Sector Taxonomy 2.1 resolver
        run: |
          python - <<'PY'
          from scripts.sector_groups import taxonomy_stats
          stats=taxonomy_stats()
          print('sector taxonomy:', stats)
          if stats.get('taxonomy_version') != '2.1.0' or int(stats.get('eligible_primary_codes') or 0) < 200:
              raise SystemExit('Sector Taxonomy gate failed')
          PY

      - name: Preserve latest published close/chip/structure files
        run: python scripts/sync_live_data.py

      - name: Choose intraday lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          sched="${{ github.event.schedule }}"
          if [[ "${{ github.event_name }}" == "schedule" && "$sched" == "10 6 * * 1-5" ]]; then
            mode=audit
          elif [[ "${{ github.event_name }}" == "schedule" && ( "$sched" == "2,12,22,32,42,52 1-4 * * 1-5" || "$sched" == "2,12,22 5 * * 1-5" ) ]]; then
            mode=structure
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode=audit
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[deep]') }}" == "true" ]]; then
            mode=audit
          else
            mode=fast
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Intraday lane: $mode"

      - name: Refresh official MIS quote layer (fast lane)
        if: ${{ steps.lane.outputs.mode == 'fast' }}
        run: python scripts/run_bridge_intraday_fast.py

      - name: Refresh Yahoo/MIS 5m technical structure
        if: ${{ steps.lane.outputs.mode == 'structure' || steps.lane.outputs.mode == 'audit' }}
        run: python scripts/run_bridge_intraday_deep_fastmis.py

      - name: Build daytrade data
        run: python scripts/build_daytrade.py

      - name: Normalize mission date and data clock
        run: python scripts/normalize_intraday_clock.py

      - name: Build 60m lifecycle + entry-position lights
        if: ${{ steps.lane.outputs.mode == 'audit' }}
        run: python scripts/build_hourly.py

      - name: Enrich support resistance structure 2.0
        run: python scripts/enrich_sr_structure.py

      - name: Archive signals + resolve real outcomes
        if: ${{ steps.lane.outputs.mode == 'audit' }}
        run: python scripts/build_validation.py --mode intraday

      - name: Build canonical data status
        run: python scripts/build_system_status.py

      - name: Fast quote freshness gate
        if: ${{ steps.lane.outputs.mode == 'fast' }}
        run: python scripts/validate_intraday_fast_publish.py

      - name: Structure freshness gate
        if: ${{ steps.lane.outputs.mode == 'structure' || steps.lane.outputs.mode == 'audit' }}
        run: python scripts/validate_intraday_publish.py

      - name: Rebuild Clean Build 2.0 Atomic Bundle from current intraday source
        if: ${{ steps.lane.outputs.mode == 'fast' || steps.lane.outputs.mode == 'structure' }}
        shell: bash
        run: bash scripts/include_v2_intraday_fast.sh

      - name: Build and validate full Clean Build 2.0 Atomic Bundle (audit lane)
        if: ${{ steps.lane.outputs.mode == 'audit' }}
        shell: bash
        run: bash scripts/include_v2_pages.sh

      - name: Publish V2 UI companions
        run: python scripts/publish_v2_companions.py

      - name: Verify V2 source date, zones and detail evidence
        run: python scripts/verify_v2_intraday.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
