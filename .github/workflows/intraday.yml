name: Radar - Intraday Update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_data.py"
      - "scripts/bridge_intraday.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "scripts/build_daytrade.py"
      - "scripts/build_completion.py"
      - "scripts/build_system_status.py"
      - "scripts/validate_intraday_publish.py"
      - "docs/index.html"
      - "docs/realtime.js"
      - "docs/realtime-config.js"
      - "docs/ui-filters.js"
      - "api/quote.js"
      - ".github/workflows/intraday.yml"
  schedule:
    # 台灣時間約 09:00~13:59；GitHub cron 可能延遲數分鐘。
    - cron: "*/5 1-5 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# All production Pages publishers share one group. Queue instead of cancelling
# so UI / close work cannot terminate an in-flight market-data publish.
concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Download last close/chip/bridge data from live Pages
        run: python scripts/sync_live_data.py || true
      - name: Build 5-minute radar base
        run: python scripts/build_data.py --mode intraday
      - name: Bridge delayed 5-minute tail with TWSE MIS snapshots
        run: python scripts/bridge_intraday.py
      - name: Enrich swing decision details
        run: python scripts/build_completion.py --mode intraday
      - name: Build isolated day-trading radar
        run: python scripts/build_daytrade.py
      - name: Preserve source intraday scan for future validation
        run: python scripts/build_validation.py --mode intraday
      - name: Build canonical data status
        run: python scripts/build_system_status.py

      - name: Strict trading-date publish gate
        run: python scripts/validate_intraday_publish.py

      - name: Verify isolation and canonical status contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          intra=json.loads(Path('docs/data/intraday.json').read_text(encoding='utf-8'))
          day=json.loads(Path('docs/data/daytrade.json').read_text(encoding='utf-8'))
          bridge=intra.get('bridge') or {}
          iso=day.get('isolation') or {}

          if intra.get('completion_version') is None:
              raise SystemExit('completion layer missing')
          if any(bool(iso.get(k)) for k in ['writes_intraday','changes_stage2','changes_swing_score','changes_intraday_score']):
              raise SystemExit('daytrade isolation contract violated')

          status=json.loads(Path('docs/data/system_status.json').read_text(encoding='utf-8'))
          if status.get('app_version') != '1.7.1':
              raise SystemExit(f"canonical app_version mismatch: {status.get('app_version')}")
          freshness=status.get('freshness') or {}
          if freshness.get('intraday_stale') or freshness.get('daytrade_stale'):
              raise SystemExit(f'canonical status marks actionable data stale: {freshness}')

          print('publish contract ok', {
              'bridge_trade_date': bridge.get('trade_date'),
              'quote_time': bridge.get('latest_quote_time'),
              'structure_time': bridge.get('latest_structure_time'),
              'intraday_rows': len(intra.get('rows') or []),
              'daytrade_rows': len(day.get('rows') or []),
              'system_dates': status.get('dates'),
          })
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
