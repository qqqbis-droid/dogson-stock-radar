name: Radar - Intraday Update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_data.py"
      - "scripts/bridge_intraday.py"
      - "scripts/sync_live_data.py"
      - "scripts/build_validation.py"
      - "scripts/build_daytrade.py"
      - "scripts/build_completion.py"
      - "scripts/build_system_status.py"
      - "docs/index.html"
      - "docs/realtime.js"
      - "docs/realtime-config.js"
      - "docs/ui-filters.js"
      - "api/quote.js"
      - ".github/workflows/intraday.yml"
  schedule:
    # 台灣時間約 09:00~13:59；GitHub cron 可能延遲數分鐘。
    - cron: "*/5 1-5 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: true

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Download last close/chip/bridge data from live Pages
        run: python scripts/sync_live_data.py || true
      - name: Build 5-minute radar base
        run: python scripts/build_data.py --mode intraday
      - name: Bridge delayed 5-minute tail with TWSE MIS snapshots
        run: python scripts/bridge_intraday.py
      - name: v1.5.30 enrich swing decision details
        run: python scripts/build_completion.py --mode intraday
      - name: Step 8 build isolated day-trading radar
        run: python scripts/build_daytrade.py
      - name: Step 7 preserve source intraday scan for future validation
        run: python scripts/build_validation.py --mode intraday
      - name: Build canonical data status
        run: python scripts/build_system_status.py
      - name: Verify intraday freshness, Step 8 isolation and canonical status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def ymd(v):
              s = str(v or '')
              for i in range(max(0, len(s)-9)):
                  x=s[i:i+10]
                  if len(x)==10 and x[4]=='-' and x[7]=='-' and x[:4].isdigit() and x[5:7].isdigit() and x[8:10].isdigit():
                      return x
              return None

          def obj_date(o):
              if not isinstance(o, dict): return None
              for k in ('trade_date','date','updated_at'):
                  d=ymd(o.get(k))
                  if d:return d
              for r in (o.get('rows') or [])[:100]:
                  if not isinstance(r,dict):continue
                  for k in ('trade_date','quote_date','date','updated_at'):
                      d=ymd(r.get(k))
                      if d:return d
              return None

          p = Path('docs/data/intraday.json')
          o = json.loads(p.read_text(encoding='utf-8'))
          b = o.get('bridge') or {}
          print('bridge=', b)
          if not b.get('bridged_rows'):
              raise SystemExit('MIS bridge produced no bridged rows')
          if o.get('completion_version') is None:
              raise SystemExit('v1.5.30 completion layer missing')

          d = json.loads(Path('docs/data/daytrade.json').read_text(encoding='utf-8'))
          iso = d.get('isolation') or {}
          if not d.get('rows'):
              raise SystemExit('daytrade radar is empty')
          if any(bool(iso.get(k)) for k in ['writes_intraday','changes_stage2','changes_swing_score','changes_intraday_score']):
              raise SystemExit('Step 8 isolation contract violated')

          close = json.loads(Path('docs/data/close.json').read_text(encoding='utf-8')) if Path('docs/data/close.json').exists() else {}
          intra_date=obj_date(o)
          day_date=obj_date(d)
          close_date=obj_date(close)
          now=datetime.now(ZoneInfo('Asia/Taipei'))
          today=now.date().isoformat()
          minute=now.hour*60+now.minute
          market_window=now.weekday()<5 and 8*60+55 <= minute <= 14*60+15

          print('freshness dates=', {'today':today,'intraday':intra_date,'daytrade':day_date,'close':close_date,'market_window':market_window})
          if close_date and (not intra_date or intra_date < close_date):
              raise SystemExit(f'intraday stale versus latest close: intraday={intra_date} close={close_date}')
          if day_date != intra_date:
              raise SystemExit(f'daytrade/intraday date mismatch: daytrade={day_date} intraday={intra_date}')
          if market_window and intra_date != today:
              raise SystemExit(f'intraday is not current Taipei trading date: intraday={intra_date} today={today}; refuse stale deploy')

          s = json.loads(Path('docs/data/system_status.json').read_text(encoding='utf-8'))
          if s.get('app_version') != '1.7.0':
              raise SystemExit('canonical system status app_version mismatch')
          freshness=s.get('freshness') or {}
          if freshness.get('intraday_stale') or freshness.get('daytrade_stale'):
              raise SystemExit(f'canonical status marks intraday/daytrade stale: {freshness}')
          print('quote_time=', b.get('latest_quote_time'), 'structure_time=', b.get('latest_structure_time'), 'daytrade=', len(d.get('rows') or []), 'completion=', o.get('completion_version'), 'system=', s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
