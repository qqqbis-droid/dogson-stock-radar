name: Legacy Radar v1.3 Live Endpoint (manual only)

# Historical recovery workflow only. Normal production publishing is owned by
# intraday.yml, close.yml and deploy-ui-v1531.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Sync latest published radar data
        run: python scripts/sync_live_data.py || true
      - name: Rebuild latest 5-minute radar before legacy recovery deploy
        run: python scripts/build_data.py --mode intraday
      - name: Verify legacy recovery payload does not contain empty intraday data
        run: |
          python -m py_compile scripts/build_data.py scripts/sync_live_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/intraday.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          if not (j.get('rows') or []):
              raise SystemExit('intraday.json has no rows; refusing legacy recovery deploy')
          print('legacy recovery rows=',len(j.get('rows') or []))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
