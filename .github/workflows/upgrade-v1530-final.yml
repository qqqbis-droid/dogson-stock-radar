name: Install Radar v1.5.30 Final Completion

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/v1530-final.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-v1530-final
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Apply final original-vision completion patch
        run: python scripts/patch_v1530_finalize.py
      - name: Verify source contracts and causal behavior
        run: |
          python -m py_compile scripts/build_data.py scripts/build_completion.py scripts/build_validation.py scripts/build_daytrade.py scripts/patch_v1530_finalize.py
          python - <<'PY'
          import json, re, sys, tempfile
          from pathlib import Path
          import numpy as np, pandas as pd
          sys.path.insert(0,'scripts')
          import build_data as bd
          import build_completion as bc
          import build_validation as bv

          idx=pd.bdate_range('2026-01-02', periods=80)
          close=np.arange(100.0,180.0); vol=np.arange(10000.0,90000.0,1000.0)
          df=pd.DataFrame({'Open':close-.2,'High':close,'Low':close-.5,'Close':close,'Volume':vol},index=idx)
          row=bd.close_technical(df)
          assert row['avg_volume20'] is not None
          assert row['breakout_event_count'] >= 3
          assert row['breakout_volume_median20'] is not None

          z={'foreign_3d_net':3000,'avg_volume20':10000}
          bc.enrich_chip(z)
          assert z['foreign_3d_strength_pct']==30.0, z
          assert z['foreign_strength_unit']=='shares / prior20d_avg_shares'

          with tempfile.TemporaryDirectory() as td:
              old_data,old_hist=bc.DATA,bc.HIST
              bc.DATA=Path(td); bc.HIST=bc.DATA/'decision_history.json'
              (bc.DATA/'status.json').write_text('{}',encoding='utf-8')
              base={'code':'0001','name':'T','close':100,'vwap':100,'vwap_dist':0,'pace':1,'ret15':0,'range_position_pct':50,'trend5':True,'break3':False,'foreign_3d_net':100,'avg_volume20':10000,'intraday_score':60,'intraday_components':{'relative_strength':8,'sector':10},'category':'觀察','quote_time':'09:05'}
              (bc.DATA/'intraday.json').write_text(json.dumps({'rows':[base],'sector_rotation':[{'sector':'PCB','heat':6,'state':'🔥 流入加速'}]},ensure_ascii=False),encoding='utf-8')
              bc.main('intraday')
              first=json.loads((bc.DATA/'intraday.json').read_text(encoding='utf-8'))
              assert first['change_radar']['today']['new_setup']==0
              base['category']='蓄勢待發';base['quote_time']='09:10';base['intraday_score']=68
              (bc.DATA/'intraday.json').write_text(json.dumps({'rows':[base],'sector_rotation':[{'sector':'PCB','heat':6.5,'state':'🔥 流入加速'}]},ensure_ascii=False),encoding='utf-8')
              bc.main('intraday')
              second=json.loads((bc.DATA/'intraday.json').read_text(encoding='utf-8'))
              assert second['change_radar']['today']['new_setup']==1
              assert second['change_radar']['today']['sector_accel_count']==1
              assert second['rows'][0]['today_transitions']['entered_setup'] is True
              bc.DATA,bc.HIST=old_data,old_hist

          research=bv.feature_research([])
          assert research['fake_breakout']['definition']
          assert '不直接改正式分數' in research['note']

          ui=Path('docs/index.html').read_text(encoding='utf-8')
          for x in ['今日新進蓄勢','今日新進剛啟動','今日族群加速','可考慮加碼','外資3日力度','歷史組合研究']:
              assert x in ui, x
          assert '\\n const life=' not in ui
          assert '\\n const dirs=' not in ui
          m=re.search(r'<script>\s*(.*?)</script>\s*<script src="./hourly.js',ui,re.S)
          assert m
          Path('/tmp/dogson-inline.js').write_text(m.group(1),encoding='utf-8')

          status=json.loads(Path('docs/data/status.json').read_text(encoding='utf-8'))
          assert status['version']=='1.5.30-free'
          assert status['completion_version']=='1.1'
          print('v1.5.30 final causal contracts OK')
          PY
          node --check /tmp/dogson-inline.js
      - name: Commit final source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_data.py scripts/build_completion.py scripts/build_validation.py docs/index.html docs/data/status.json
          git diff --cached --quiet || git commit -m "Finalize v1.5.30 original vision completion"
          ok=0
          for n in $(seq 1 12); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true
            sleep 3
          done
          test "$ok" = 1
      - name: Refresh completed-session data
        run: |
          python scripts/sync_live_data.py || true
          python scripts/build_data.py --mode close
          python scripts/build_completion.py --mode close
          python scripts/build_hourly.py
          python scripts/build_validation.py --mode close
      - name: Verify generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/data/close.json').read_text(encoding='utf-8'))
          v=json.loads(Path('docs/data/validation.json').read_text(encoding='utf-8'))
          rows=c.get('rows') or []
          assert rows
          assert all('avg_volume20' in r for r in rows[:20])
          assert all('foreign_3d_strength_pct' in r for r in rows[:20])
          assert all('breakout_volume_baseline_mode' in r for r in rows[:20])
          assert 'research' in v
          print('generated close rows',len(rows),'research matured',v['research'].get('matured_rows'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
