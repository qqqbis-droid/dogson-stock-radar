name: Install Radar v1.3.4 Intraday Capital Rotation

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogson-pages
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Install v1.3.4 intraday capital rotation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Apply v1.3.4 patch
        run: python scripts/patch_v134.py

      - name: Syntax check
        run: python -m py_compile scripts/build_data.py

      - name: Preserve live data and rebuild intraday radar
        run: |
          python scripts/sync_live_data.py || true
          python scripts/build_data.py --mode intraday

      - name: Verify pure intraday score and capital rotation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          i = json.loads(Path('docs/data/intraday.json').read_text(encoding='utf-8'))
          m = i.get('market') or {}
          assert 'Free Edition v1.3.4' in h
          assert '族群資金輪動' in h
          assert m.get('intraday_only') is True
          assert m.get('foreign_used_in_score') is False
          assert set((m.get('components') or {}).keys()) >= {'taiex','otc','breadth','funds','sector'}
          assert 0 <= float(m.get('market_score', -1)) <= 15
          rot = i.get('sector_rotation')
          assert isinstance(rot, list)
          print('market_score=', m.get('market_score'))
          print('market_mode=', m.get('market_mode'))
          print('turnover_up_pct=', m.get('turnover_up_pct'))
          print('above_vwap_turnover_pct=', m.get('above_vwap_turnover_pct'))
          print('sector_rotation_count=', len(rot))
          print('top_rotation=', [(x.get('sector'), x.get('state'), x.get('heat')) for x in rot[:5]])
          PY

      - name: Commit source and UI upgrade
        run: |
          git config user.name "qqqbis-droid"
          git config user.email "qqqbis@gmail.com"
          git add scripts/build_data.py docs/index.html
          git diff --cached --quiet || git commit -m "Apply v1.3.4 pure intraday market and rotation radar"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
