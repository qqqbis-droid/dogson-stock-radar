name: Test - 60K Radar v1.4

on:
  push:
    branches: ["feature/60k-entrylight-v140"]
    paths:
      - "scripts/build_hourly.py"
      - "scripts/sync_live_data.py"
      - "docs/hourly.js"
      - "docs/realtime-config.js"
      - "docs/data/hourly.json"
      - ".github/workflows/close.yml"
      - ".github/workflows/test-hourly-v140.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build hourly radar from current close snapshot
        run: python scripts/build_hourly.py
      - name: Validate hourly output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/hourly.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          rows=j.get('rows') or []
          print('hourly rows',len(rows),'counts',j.get('counts'),'lights',j.get('entry_light_counts'),'failed',j.get('failed_60m'))
          if len(rows) < 20:
              raise SystemExit('too few hourly rows; likely data/build failure')
          needed={'category60','score60','combined_score','entry_light','entry_light_label','price_vs20_60_pct','dir20','dir60','dir240'}
          bad=[r.get('code') for r in rows if not needed.issubset(r)]
          if bad:
              raise SystemExit(f'missing hourly fields: {bad[:5]}')
          if not any(r.get('entry_light')=='GREEN' for r in rows):
              raise SystemExit('no green entry lights')
          PY
      - name: Check browser scripts
        run: |
          node --check docs/hourly.js
          node --check docs/realtime-config.js
