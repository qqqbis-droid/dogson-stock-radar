name: Research - 60m Cross + 240T Filter

on:
  push:
    branches:
      - research/scan60-20260922
    paths:
      - .github/workflows/research-scan60-240.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q 'yfinance>=0.2.54' pandas numpy
      - name: Full market scan with 240T filter
        shell: bash
        run: |
          python - <<'PY'
          import json, math, time
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          uni=json.loads(Path('docs/data/universe.json').read_text(encoding='utf-8'))
          meta={}
          for x in uni:
              code=str(x.get('code','')).strip(); market=str(x.get('market') or '').strip()
              if not (code.isdigit() and len(code)==4): continue
              sym=code+('.TWO' if market=='上櫃' else '.TW')
              meta[sym]={'code':code,'name':str(x.get('name') or code),'market':market}
          syms=list(meta)
          print('UNIVERSE',len(syms))

          close_data=json.loads(Path('docs/data/close.json').read_text(encoding='utf-8'))
          radar={str(r.get('code')):r for r in close_data.get('rows',[]) if isinstance(r,dict) and r.get('code')}

          def frame(raw,sym,batch):
              if raw is None or raw.empty: return None
              try:
                  if isinstance(raw.columns,pd.MultiIndex):
                      l0=set(map(str,raw.columns.get_level_values(0))); l1=set(map(str,raw.columns.get_level_values(1)))
                      if sym in l0: d=raw[sym].copy()
                      elif sym in l1: d=raw.xs(sym,axis=1,level=1).copy()
                      else: return None
                  elif len(batch)==1: d=raw.copy()
                  else: return None
                  if isinstance(d.columns,pd.MultiIndex): d.columns=[str(c[0]) for c in d.columns]
                  if 'Close' not in d.columns or 'Volume' not in d.columns: return None
                  d=d[['Close','Volume']].copy()
                  d['Close']=pd.to_numeric(d['Close'],errors='coerce'); d['Volume']=pd.to_numeric(d['Volume'],errors='coerce').fillna(0)
                  d=d.dropna(subset=['Close']); d=d[d['Close']>0]
                  return d if len(d)>=241 else None
              except Exception:
                  return None

          out=[]; failed=[]; bs=50
          for st in range(0,len(syms),bs):
              batch=syms[st:st+bs]
              try:
                  raw=yf.download(batch,period='3mo',interval='60m',group_by='ticker',auto_adjust=False,threads=True,progress=False,prepost=False)
              except Exception as e:
                  print('BATCH_ERR',st,repr(e)); failed+=batch; continue
              got=0
              for sym in batch:
                  d=frame(raw,sym,batch)
                  if d is None: failed.append(sym); continue
                  got+=1
                  c=d['Close']; v=d['Volume']
                  ma20=c.rolling(20).mean(); ma60=c.rolling(60).mean(); ma240=c.rolling(240).mean()
                  if any(pd.isna(s.iloc[-1]) for s in (ma20,ma60,ma240)): continue
                  cross_age=None
                  for age in range(0,min(8,len(d)-60)):
                      i=len(d)-1-age
                      if i<=0: break
                      if pd.notna(ma60.iloc[i-1]) and ma20.iloc[i-1] <= ma60.iloc[i-1] and ma20.iloc[i] > ma60.iloc[i]:
                          cross_age=age; break
                  gap2060=(ma20.iloc[-1]/ma60.iloc[-1]-1)*100
                  slope20=(ma20.iloc[-1]/ma20.iloc[-4]-1)*100 if pd.notna(ma20.iloc[-4]) else 0
                  slope240=(ma240.iloc[-1]/ma240.iloc[-6]-1)*100 if pd.notna(ma240.iloc[-6]) else 0
                  price=float(c.iloc[-1]); m240=float(ma240.iloc[-1])
                  above240=price>=m240
                  overhead=((m240/price)-1)*100 if not above240 else 0.0
                  if above240:
                      pressure='PASS_ABOVE_240'
                  elif overhead>5:
                      pressure='PASS_240_FAR_GT5'
                  elif overhead>3:
                      pressure='WATCH_240_3_5'
                  elif overhead<=1.5:
                      pressure='REJECT_240_NEAR_LE1_5'
                  elif slope240<=0:
                      pressure='REJECT_240_1_5_3_DOWNFLAT'
                  else:
                      pressure='WATCH_240_1_5_3_UP'

                  idx=pd.to_datetime(d.index); dates=pd.Series([z.date() for z in idx],index=d.index)
                  day_close=c.groupby(dates).last(); day_vol=v.groupby(dates).sum(); day_turn=(c*v).groupby(dates).sum()
                  ret1=(day_close.iloc[-1]/day_close.iloc[-2]-1)*100 if len(day_close)>=2 else None
                  ret5=(day_close.iloc[-1]/day_close.iloc[-6]-1)*100 if len(day_close)>=6 else None
                  ret20=(day_close.iloc[-1]/day_close.iloc[-21]-1)*100 if len(day_close)>=21 else None
                  avgvol=float(day_vol.tail(10).mean())/1000 if len(day_vol) else 0
                  avgturn=float(day_turn.tail(10).mean())/1e6 if len(day_turn) else 0
                  liquid=avgturn>=50 and avgvol>=300
                  status='other'
                  if cross_age==0 and ma20.iloc[-1]>ma60.iloc[-1]: status='EXACT'
                  elif cross_age is not None and cross_age<=2 and ma20.iloc[-1]>ma60.iloc[-1]: status='RECENT3'
                  elif ma20.iloc[-1]<=ma60.iloc[-1] and -0.8<=gap2060<=0 and slope20>0: status='NEAR'
                  if status=='other' or not liquid: continue
                  m=meta[sym]; r=radar.get(m['code'],{})
                  out.append({
                    **m,'status':status,'price':round(price,2),'ma20_60':round(float(ma20.iloc[-1]),3),'ma60_60':round(float(ma60.iloc[-1]),3),'ma240_60':round(m240,3),
                    'gap20_60_pct':round(float(gap2060),3),'cross_age':cross_age,'slope20_3bar_pct':round(float(slope20),3),'slope240_5bar_pct':round(float(slope240),3),
                    'above240':above240,'overhead240_pct':round(float(overhead),2),'pressure':pressure,
                    'avg_turn10_m':round(avgturn,1),'avg_vol10_lots':round(avgvol,1),'ret1d':None if ret1 is None else round(float(ret1),2),'ret5d':None if ret5 is None else round(float(ret5),2),'ret20d':None if ret20 is None else round(float(ret20),2),
                    'radar_score':r.get('score'),'technical_score':r.get('technical_score'),'sector_score':r.get('sector_score'),'industry_hot_count':r.get('industry_hot_count'),'rsi':None if r.get('rsi') is None else round(float(r.get('rsi')),1),'vol_x':None if r.get('vol_x') is None else round(float(r.get('vol_x')),2),'category':r.get('category'),
                    'support':r.get('support'),'resistance':r.get('resistance')
                  })
              print(f'BATCH {st//bs+1}/{math.ceil(len(syms)/bs)} got={got}/{len(batch)}')
              time.sleep(.35)

          clean=[r for r in out if r['pressure'].startswith('PASS')]
          watch=[r for r in out if r['pressure'].startswith('WATCH')]
          reject=[r for r in out if r['pressure'].startswith('REJECT')]
          def rk(r):
              s={'EXACT':0,'RECENT3':1,'NEAR':2}[r['status']]
              score=-(r['radar_score'] if isinstance(r['radar_score'],(int,float)) else 0)
              return (s,score,abs(r['gap20_60_pct']),-r['avg_turn10_m'])
          for a in (clean,watch,reject): a.sort(key=rk)
          result={'asof':'2026-09-22 close','definition':'60m SMA20/SMA60 crossover/near crossover + 60m SMA240 overhead filter','universe':len(syms),'failed':len(set(failed)),'candidate_count':len(out),'clean_count':len(clean),'watch_count':len(watch),'reject_count':len(reject),'clean':clean,'watch':watch,'reject':reject}
          Path('/tmp/scan60_240.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT_JSON_BEGIN')
          print(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          print('RESULT_JSON_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scan60-240-20260922
          path: /tmp/scan60_240.json
          retention-days: 3
