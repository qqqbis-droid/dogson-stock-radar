name: Clean Build 2.0 Phase 5 Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - clean-build-v2
    paths:
      - '.github/triggers/v2-shadow.trigger'
  schedule:
    # 16:45 Asia/Taipei, Monday–Friday. Trading-calendar validity is still
    # determined from the source datasets; duplicate trade dates do not create
    # additional Shadow samples.
    - cron: '45 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: clean-build-v2-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/clean-build-v2' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-build-v2
          fetch-depth: 1
      - name: Fetch current production data snapshot
        run: |
          git fetch origin main --depth=1
          mkdir -p /tmp/dogson-main-data
          for f in market.json close.json intraday.json daytrade.json; do
            git show origin/main:docs/data/$f > /tmp/dogson-main-data/$f
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-contract.txt
      - name: Contract and structural engine gates
        run: |
          python -m unittest discover -s contracts/contract-tests -p 'test_*.py' -v
          python -m unittest scripts.v2.test_engine -v
          python -m unittest scripts.v2.test_shadow_summary -v
      - name: Build validated Shadow cycle from production public data
        run: python -m scripts.v2.shadow_cycle --legacy-root /tmp/dogson-main-data --output docs/v2/data --reports shadow/reports
      - name: Refresh distinct-day Shadow summary
        run: python -m scripts.v2.shadow_summary --reports shadow/reports --output shadow/summary.json
      - name: Validate active atomic bundle
        run: python -m scripts.v2.validate_bundle --root docs/v2/data
      - name: Syntax check UI modules
        run: |
          node --check docs/v2/app.js
          node --check docs/v2/components-ui.js
          node --check docs/v2/quote-ui.js
          node --check docs/v2/tradeplan-ui.js
          node --check docs/v2/case-ui.js
      - name: Commit new trading-day Shadow snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2/data shadow
          if git diff --cached --quiet; then
            echo "No new source build / Shadow sample"
          else
            git commit -m "chore(v2): record Phase 5 Shadow snapshot [skip ci]"
            git push origin HEAD:clean-build-v2
          fi
