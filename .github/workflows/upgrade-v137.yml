name: Install Radar v1.3.7 TPEx Index Repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Install v1.3.7 TPEx index repair'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply v1.3.7 patch
        run: python scripts/patch_v137.py

      - name: Syntax check
        run: python -m py_compile scripts/build_data.py

      - name: Verify TPEx official index endpoint
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import build_data
          x = build_data.tpex_index_history()
          print('TPEx rows=', len(x))
          print(x.tail(3).to_string())
          assert len(x) >= 25, 'TPEx official index history has fewer than 25 rows'
          latest = str(x.index[-1].date())
          print('TPEx latest=', latest, 'close=', float(x['Close'].iloc[-1]))
          PY

      - name: Rebuild close radar
        run: python scripts/build_data.py --mode close

      - name: Verify official OTC index consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/data/close.json')
          j = json.loads(p.read_text(encoding='utf-8'))
          trade = j.get('trade_date')
          m = j.get('market') or {}
          otc = m.get('otc') or {}
          print('trade_date=', trade)
          print('data_complete=', m.get('data_complete'))
          print('market_mode=', m.get('market_mode'))
          print('market_score=', m.get('market_score'))
          print('otc=', otc)
          assert otc, 'OTC index still missing'
          assert otc.get('date') == trade, f"OTC date mismatch: {otc.get('date')} != {trade}"
          assert 'TPEx OpenAPI' in str(otc.get('source')), f"unexpected OTC source: {otc.get('source')}"
          assert otc.get('close') is not None, 'OTC close missing'
          PY

      - name: Commit source UI and rebuilt data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_data.py docs/index.html docs/data
          git commit -m 'Apply v1.3.7 official TPEx index fallback' || true
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
