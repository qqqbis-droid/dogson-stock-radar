name: Research - 60m Radar V4 Combined
on:
  push:
    branches: [ research/scan60-v4-20260923 ]
    paths: [ '.github/workflows/research-scan60-v4-combined.yml' ]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q 'yfinance>=0.2.54' pandas numpy
      - name: Full market 60m + daily/chip/sector second-stage scan
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          close_obj=json.loads(Path('docs/data/close.json').read_text(encoding='utf-8'))
          close_rows={str(r.get('code')):r for r in close_obj.get('rows',[]) if isinstance(r,dict) and r.get('code')}
          uni=json.loads(Path('docs/data/universe.json').read_text(encoding='utf-8'))
          meta={}
          for x in uni:
              code=str(x.get('code','')).strip(); market=str(x.get('market') or '').strip()
              if not(code.isdigit() and len(code)==4) or code not in close_rows: continue
              sym=code+('.TWO' if market=='上櫃' else '.TW')
              meta[sym]={'code':code,'name':str(x.get('name') or code),'market':market,
                         'industry_name':str(x.get('industry_name') or close_rows[code].get('industry_name') or ''),
                         'sector_group':str(x.get('sector_group') or close_rows[code].get('sector_group') or '')}
          syms=list(meta)

          def frame(raw,sym,batch):
              if raw is None or raw.empty: return None
              try:
                  if isinstance(raw.columns,pd.MultiIndex):
                      l0=set(map(str,raw.columns.get_level_values(0))); l1=set(map(str,raw.columns.get_level_values(1)))
                      if sym in l0: d=raw[sym].copy()
                      elif sym in l1: d=raw.xs(sym,axis=1,level=1).copy()
                      else: return None
                  elif len(batch)==1: d=raw.copy()
                  else: return None
                  if isinstance(d.columns,pd.MultiIndex): d.columns=[str(c[0]) for c in d.columns]
                  if 'Close' not in d.columns or 'Volume' not in d.columns: return None
                  d=d[['Close','Volume']].copy()
                  d['Close']=pd.to_numeric(d['Close'],errors='coerce'); d['Volume']=pd.to_numeric(d['Volume'],errors='coerce').fillna(0)
                  d=d.dropna(subset=['Close']); d=d[d['Close']>0]
                  return d if len(d)>=246 else None
              except Exception:
                  return None

          def dirs(s):
              one=(s.iloc[-1]/s.iloc[-2]-1)*100
              three=(s.iloc[-1]/s.iloc[-3]-1)*100
              five=(s.iloc[-1]/s.iloc[-6]-1)*100
              if one>0 and three>0.03: lab='UP'
              elif one>=-0.02 and three>=-0.05: lab='FLAT'
              else: lab='DOWN'
              return lab,float(one),float(three),float(five)

          def daily_position_score(r):
              # 20 pts: location vs daily 20MA, RSI, recent extension, trend/momentum context.
              dist=float(r.get('dist20') or 0); rsi=float(r.get('rsi') or 50); ret5=float(r.get('ret5') or 0)
              s=0
              if 0<=dist<=8: s+=8
              elif -5<=dist<0: s+=6
              elif 8<dist<=12: s+=5
              elif -8<=dist<-5: s+=4
              else: s+=1
              if 50<=rsi<=68: s+=5
              elif 45<=rsi<50 or 68<rsi<=72: s+=4
              elif 40<=rsi<45 or 72<rsi<=78: s+=2
              else: s+=1
              if -3<=ret5<=10: s+=4
              elif 10<ret5<=15: s+=2
              elif -6<=ret5<-3: s+=2
              else: s+=0
              momentum=bool(r.get('trend')) or bool(r.get('break3')) or ((r.get('macd_h') or 0)>0 and (r.get('macd_acc') or 0)>0)
              s+=3 if momentum else 1
              return min(20,int(s))

          rows=[]; failed=[]; bs=50
          for st in range(0,len(syms),bs):
              batch=syms[st:st+bs]
              try:
                  raw=yf.download(batch,period='3mo',interval='60m',group_by='ticker',auto_adjust=False,threads=True,progress=False,prepost=False)
              except Exception:
                  failed+=batch; continue
              for sym in batch:
                  d=frame(raw,sym,batch)
                  if d is None: failed.append(sym); continue
                  c=d['Close']; v=d['Volume']; ma20=c.rolling(20).mean(); ma60=c.rolling(60).mean(); ma240=c.rolling(240).mean()
                  if any(pd.isna(s.iloc[-6]) or pd.isna(s.iloc[-1]) for s in (ma20,ma60,ma240)): continue
                  d20,o20,t20,s20=dirs(ma20); d60,o60,t60,s60=dirs(ma60); d240,o240,t240,s240=dirs(ma240)
                  price=float(c.iloc[-1]); m20=float(ma20.iloc[-1]); m60=float(ma60.iloc[-1]); m240=float(ma240.iloc[-1])
                  gap=(m20/m60-1)*100; p20=(price/m20-1)*100; above240=price>=m240
                  overhead=((m240/price)-1)*100 if not above240 else 0.0; orderly=price>m20>m60>m240
                  slope_diff=abs(s20-s60)
                  idx=pd.to_datetime(d.index); dates=pd.Series([z.date() for z in idx],index=d.index)
                  day_vol=v.groupby(dates).sum(); day_turn=(c*v).groupby(dates).sum()
                  avgvol=float(day_vol.tail(10).mean())/1000 if len(day_vol) else 0; avgturn=float(day_turn.tail(10).mean())/1e6 if len(day_turn) else 0
                  if not(avgturn>=50 and avgvol>=300): continue
                  lastv=float(day_vol.iloc[-1]) if len(day_vol) else 0; prev9=float(day_vol.iloc[-10:-1].mean()) if len(day_vol)>=10 else 0
                  volratio=lastv/prev9 if prev9>0 else None
                  cross_age=None
                  for age in range(0,min(120,len(d)-60)):
                      i=len(d)-1-age
                      if i<=0: break
                      if ma20.iloc[i-1]<=ma60.iloc[i-1] and ma20.iloc[i]>ma60.iloc[i]: cross_age=age; break
                  if (not above240) and overhead<=3 and d240!='UP': continue
                  cat=None
                  if m20<=m60 and -0.8<=gap<=0 and d20=='UP' and d60 in ('UP','FLAT'): cat='PRE_CROSS'
                  elif m20>m60 and cross_age is not None and cross_age<=3 and d20=='UP' and d60 in ('UP','FLAT'): cat='EARLY'
                  elif m20>m60 and d20=='UP' and d60=='UP':
                      cat='ACCEL_CONT' if (s20>=s60 and slope_diff>0.60) else 'STABLE_CONT'
                  else: continue

                  # 60K score /100
                  score=0
                  score += 12 if d20=='UP' else 0
                  score += 10 if d60=='UP' else (5 if d60=='FLAT' else 0)
                  score += 3 if m20>m60 else 1
                  score += 8 if cat=='PRE_CROSS' else (12 if cat=='EARLY' else 15)
                  score += 10 if above240 else (4 if overhead>5 else 2)
                  score += 8 if d240=='UP' else (5 if d240=='FLAT' else 2)
                  score += 2 if orderly else 0
                  score += 10 if slope_diff<=0.30 else (8 if slope_diff<=0.60 else (6 if slope_diff<=1.20 else (3 if slope_diff<=2 else 1)))
                  ap=abs(p20); score += 15 if ap<=3 else (12 if ap<=5 else (7 if ap<=8 else (3 if ap<=12 else 1)))
                  if cat=='PRE_CROSS':
                      ag=abs(gap); score += 10 if ag<=0.30 else (8 if ag<=0.80 else 3)
                  else:
                      score += 10 if 0<=gap<=3 else (6 if 3<gap<=6 else 2)
                  score += 2 if volratio is None else (5 if 0.8<=volratio<=2.5 else (3 if 0.5<=volratio<0.8 or 2.5<volratio<=4 else 1))
                  score=min(100,int(score))

                  m=meta[sym]; cr=close_rows[m['code']]
                  dpos=daily_position_score(cr); chip=float(cr.get('chip_score') or 0); sect=float(cr.get('sector_score') or 0)
                  combined=round(score*0.50 + dpos + chip*0.80 + sect,1)
                  rows.append({**m,'category60':cat,'score60':score,'combined_score':combined,
                      'price':round(price,2),'ma20_60':round(m20,3),'ma60_60':round(m60,3),'ma240_60':round(m240,3),
                      'dir20':d20,'dir60':d60,'dir240':d240,'s20_5':round(s20,3),'s60_5':round(s60,3),'s240_5':round(s240,3),
                      'slope_diff':round(slope_diff,3),'gap20_60_pct':round(gap,3),'cross_age':cross_age,'price_vs20_60_pct':round(p20,2),
                      'above240':above240,'orderly':orderly,'vol_ratio60day':None if volratio is None else round(volratio,2),
                      'daily_position_score':dpos,'daily_technical_score':cr.get('technical_score'),'daily_dist20':round(float(cr.get('dist20') or 0),2),
                      'daily_rsi':round(float(cr.get('rsi') or 0),1),'daily_ret5':round(float(cr.get('ret5') or 0),2),'daily_ret20':round(float(cr.get('ret20') or 0),2),
                      'daily_trend':bool(cr.get('trend')),'daily_break3':bool(cr.get('break3')),'daily_category':cr.get('category'),
                      'chip_score':cr.get('chip_score'),'chip_coverage_pct':cr.get('chip_coverage_pct'),'chip_date':cr.get('chip_date'),
                      'foreign_3buy':cr.get('foreign_3buy'),'foreign_net_latest':cr.get('foreign_net_latest'),'foreign_3d_net':cr.get('foreign_3d_net'),
                      'sbl_3down':cr.get('sbl_3down'),'sbl_3change_pct':cr.get('sbl_3change_pct'),'trust_net_latest':cr.get('trust_net_latest'),
                      'margin_status':cr.get('margin_status'),'margin_3d_pct':cr.get('margin_3d_pct'),'chip_combo':cr.get('chip_combo'),
                      'sector_score':cr.get('sector_score'),'industry_hot_count':cr.get('industry_hot_count'),'sector_fallback':cr.get('sector_fallback'),
                      'existing_radar_score':cr.get('score')})
              time.sleep(.25)

          groups={k:sorted([r for r in rows if r['category60']==k],key=lambda x:(-x['combined_score'],-x['score60'],-(x['existing_radar_score'] or 0))) for k in ['PRE_CROSS','EARLY','STABLE_CONT','ACCEL_CONT']}
          # Balanced review shortlist: max 4 from each lifecycle; global 16 unique.
          shortlist=[]; seen=set()
          for k,n in [('PRE_CROSS',4),('EARLY',4),('STABLE_CONT',4),('ACCEL_CONT',4)]:
              for r in groups[k][:n]:
                  if r['code'] not in seen: shortlist.append(r); seen.add(r['code'])
          shortlist=sorted(shortlist,key=lambda x:-x['combined_score'])
          result={'asof':close_obj.get('updated_at'),'method':'60K 50% + daily position 20% + chips 20% + sector 10%; lifecycle is a filter, combined score is a review rank',
                  'counts':{k:len(v) for k,v in groups.items()},'failed_60m':len(set(failed)),'shortlist':shortlist,'top10_each':{k:v[:10] for k,v in groups.items()}}
          Path('/tmp/scan60_v4.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT_BEGIN')
          print(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          print('RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scan60-v4-20260923
          path: /tmp/scan60_v4.json
          retention-days: 3
