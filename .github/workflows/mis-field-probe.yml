name: MIS Field Probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/mis-field-probe.trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/test_mis_fields.py
