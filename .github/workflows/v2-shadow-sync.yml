name: Clean Build 2.0 Shadow Sync

# ignition-final-entry-resync-20261008

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-shadow-sync.yml"
  workflow_run:
    workflows:
      - "Radar - Intraday Update"
      - "Radar - Close Update"
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: clean-build-v2-shadow-sync
  cancel-in-progress: true

jobs:
  sync-v2-shadow:
    # A workflow-file edit must not rebuild yesterday's branch from an in-flight public CDN.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Clean Build 2.0 branch
        uses: actions/checkout@v4
        with:
          ref: clean-build-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install contract validator
        run: pip install -r requirements-contract.txt

      - name: Download exact production Pages artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .shadow-pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Pull production public datasets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .shadow-main-data .shadow-pages
          mkdir -p .shadow-main-data

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            mkdir -p .shadow-pages
            test -s .shadow-pages-artifact/artifact.tar
            tar -xf .shadow-pages-artifact/artifact.tar -C .shadow-pages
            cp .shadow-pages/data/close.json .shadow-main-data/close.json
            cp .shadow-pages/data/intraday.json .shadow-main-data/intraday.json
            cp .shadow-pages/data/daytrade.json .shadow-main-data/daytrade.json
            cp .shadow-pages/data/market.json .shadow-main-data/market.json
            # Hourly evidence must travel with the same verified deployment snapshot.
            if [[ -s .shadow-pages/data/hourly.json ]]; then
              cp .shadow-pages/data/hourly.json .shadow-main-data/hourly.json
            fi
            echo "Shadow source: exact Pages artifact from upstream run ${{ github.event.workflow_run.id }}"
          else
            base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
            for name in close intraday daytrade market; do
              curl -fsSL --retry 3 -H 'Cache-Control: no-cache' \
                "${base}/${name}.json?shadow_run=${GITHUB_RUN_ID}" \
                -o ".shadow-main-data/${name}.json"
            done
            curl -fsSL --retry 3 -H 'Cache-Control: no-cache' \
              "${base}/hourly.json?shadow_run=${GITHUB_RUN_ID}" \
              -o ".shadow-main-data/hourly.json" || echo "Hourly public snapshot missing; checking verified official artifact"
            echo "Shadow source: currently deployed GitHub Pages"
          fi

          test -s .shadow-main-data/close.json
          test -s .shadow-main-data/intraday.json
          test -s .shadow-main-data/daytrade.json
          test -s .shadow-main-data/market.json

          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('close','intraday','daytrade','market'):
              obj=json.loads(Path(f'.shadow-main-data/{name}.json').read_text(encoding='utf-8'))
              print(name, obj.get('trade_date') or obj.get('source_trade_date') or obj.get('date'))
          PY

      - name: Preserve exact upstream intraday Atomic Bundle (do not rebuild as POST_CLOSE)
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Radar - Intraday Update' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s .shadow-pages/v2/data/current_manifest.json
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('.shadow-pages/v2/data')
          mf=json.loads((root/'current_manifest.json').read_text(encoding='utf-8'))
          source=json.loads(Path('.shadow-main-data/intraday.json').read_text(encoding='utf-8'))
          day=json.loads(Path('.shadow-main-data/daytrade.json').read_text(encoding='utf-8'))
          src=str(source.get('as_of') or '')
          di=str((mf.get('datasets') or {}).get('decision_intraday_summary',{}).get('as_of') or '')
          dd=str((mf.get('datasets') or {}).get('decision_daytrade_summary',{}).get('as_of') or '')
          now=datetime.now(ZoneInfo('Asia/Taipei'))
          if src != di or src != dd or str(day.get('as_of') or '') != src:
              raise SystemExit(f'Unsafe shadow source mismatch: source={src} intraday={di} daytrade={dd}')
          stamp=datetime.fromisoformat(src)
          if stamp > now + timedelta(minutes=2):
              raise SystemExit(f'Future-dated upstream quote blocked: {src} now={now}')
          if str(mf.get('trade_date') or '')[:10] != src[:10]:
              raise SystemExit('Atomic bundle session date differs from upstream MIS trade date')
          if now.weekday()<5 and 9 <= now.hour < 13 and stamp.date()==now.date() and mf.get('session_phase')!='LIVE':
              raise SystemExit('Active-session Shadow must preserve the upstream LIVE phase')
          print('EXACT SOURCE BUNDLE LOCK',mf.get('active_build_id'),mf.get('session_phase'),src)
          PY
          rm -rf docs/v2/data
          cp -a .shadow-pages/v2/data docs/v2/data
          echo "Shadow reused the fully validated upstream V2 bundle; no artificial 13:30 source clock."

      - name: Locate last successful official Close Update
        id: verified_close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/close.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Verified EOD source: Radar Close Update run $run_id"

      - name: Download exact verified EOD artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .verified-close-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified_close.outputs.run_id }}

      - name: Restore original full-scored EOD from verified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verified-close-pages
          test -s .verified-close-artifact/artifact.tar
          tar -xf .verified-close-artifact/artifact.tar -C .verified-close-pages
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          live=Path(".shadow-main-data")
          verified=Path(".verified-close-pages/data")
          current=json.loads((live/"close.json").read_text(encoding="utf-8"))
          official=json.loads((verified/"close.json").read_text(encoding="utf-8"))
          official_market=json.loads((verified/"market.json").read_text(encoding="utf-8"))
          vday=str(official.get("trade_date") or "")[:10]
          lday=str(current.get("trade_date") or "")[:10]
          if not vday or (lday and vday < lday):
              raise SystemExit(f"Verified close snapshot {vday} older than visible close {lday}: refuse downgrade")
          if str(official_market.get("trade_date") or "")[:10]!=vday:
              raise SystemExit(f"Verified market context does not match verified close {vday}")
          shutil.copyfile(verified/"close.json",live/"close.json")
          shutil.copyfile(verified/"market.json",live/"market.json")
          official_hourly=verified/"hourly.json"
          if official_hourly.is_file() and official_hourly.stat().st_size>0:
              hourly=json.loads(official_hourly.read_text(encoding="utf-8"))
              hday=str(hourly.get("trade_date") or "")[:10]
              rows=hourly.get("all_rows") or hourly.get("rows") or []
              if not hday or hday>vday or not rows:
                  raise SystemExit(f"Official hourly source invalid: hourly={hday}, close={vday}, rows={len(rows)}")
              shutil.copyfile(official_hourly,live/"hourly.json")
              print("Hourly evidence sourced from official Close artifact:",{"hourly_date":hday,"close_date":vday,"rows":len(rows),"same_session":hday==vday})
          elif not (live/"hourly.json").is_file():
              print("WARNING: official artifact has no 60K evidence; historical card will be unavailable")
          # Data is explicitly dated, never promoted to the newer close session.

          print("Full scoring EOD source:",{"date":vday,"stocks":len(official.get("rows") or []),
                "source":"verified successful Radar - Close Update Pages artifact"})
          PY

      - name: Verify last known 60K source provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          close=json.loads(Path('.shadow-main-data/close.json').read_text(encoding='utf-8'))
          hpath=Path('.shadow-main-data/hourly.json')
          if hpath.is_file():
              hourly=json.loads(hpath.read_text(encoding='utf-8'))
              cday=str(close.get('trade_date') or '')[:10]
              hday=str(hourly.get('trade_date') or '')[:10]
              if not hday or not cday or hday>cday:
                  raise SystemExit(f'Hourly future-date mismatch: {hday} vs {cday}')
              print('60K last known valid session:',hday,'close:',cday,'historical:',hday<cday)
          else:
              print('60K source unavailable: no snapshot will be invented')
          PY

      - name: Verify original Wave Score 2.0 in downloaded source
        run: |
          python scripts/v2/validate_full_swing_source.py --source .shadow-main-data/close.json
          echo "Source-side scoring must include original tech6/chip7/sector6/liquidity5. No substitute legacy score allowed."

      - name: Build 2.0 canonical atomic bundle
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: python scripts/v2/build_legacy_bundle.py --legacy-root .shadow-main-data --output docs/v2/data

      - name: Copy canonical quote snapshot into lightweight indexes
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: python scripts/v2/enrich_quote_index.py --output docs/v2/data

      - name: Migrate structural support / resistance zones
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: python scripts/v2/enrich_zones.py --legacy-root .shadow-main-data --output docs/v2/data

      - name: Enrich mission-specific stock detail evidence
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: python scripts/v2/enrich_stock_detail_context.py --legacy-root .shadow-main-data --root docs/v2/data

      - name: Confirm full original score ledger survived detail import
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: |
          python scripts/v2/validate_full_swing_source.py --source .shadow-main-data/close.json --atomic-root docs/v2/data

      - name: Restore market/capital and latest-close semantics
        # Legacy rebuild is for completed-close runs only. Intraday already supplied verified V2.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Radar - Intraday Update' }}
        run: |
          python scripts/v2/restore_market_capital_context.py --legacy-root .shadow-main-data --root docs/v2/data
          python scripts/v2/normalize_close_snapshot_by_close_date.py --root docs/v2/data --legacy-root .shadow-main-data
          # A Shadow re-build replaces the whole Atomic bundle; it must rebuild
          # this date-bound constituent ledger, never silently drop it.
          python scripts/v2/build_capital_stock_breakdown.py --root docs/v2/data --registry contracts/registries/sector_registry.json
          python scripts/v2/preserve_frozen_close.py --root docs/v2/data --frozen-root docs/v2/frozen-close/latest
          python scripts/v2/stamp_version_contract.py --root docs/v2/data

      - name: Validate contract and UI syntax
        run: |
          python scripts/v2/validate_bundle.py --root docs/v2/data
          python scripts/v2/validate_market_capital_context.py --root docs/v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/v2/data/current_manifest.json').read_text(encoding='utf-8'))
          required=(
              'version_registry_version','version_set_id','schema_version',
              'app_contract_version','engine_version','enum_registry_version',
              'threshold_registry_version','taxonomy_version',
          )
          missing=[k for k in required if not m.get(k)]
          if missing:
              raise SystemExit(f'Shadow Version Registry binding missing: {missing}')
          datasets=m.get('datasets') or {}
          required_ds=('zone_intraday','zone_close','zone_daytrade','stock_detail_intraday','stock_detail_close','stock_detail_daytrade')
          missing_ds=[k for k in required_ds if k not in datasets]
          if missing_ds:
              raise SystemExit(f'Shadow detail datasets missing: {missing_ds}')
          root=Path('docs/v2/data')
          def resolve(url):
              raw=str(url or '')
              return root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
          close=json.loads(resolve(datasets['decision_close_summary']['url']).read_text(encoding='utf-8'))
          canonical=str((datasets.get('decision_close_summary') or {}).get('as_of') or '')[:10]
          bad=[r.get('code') for r in close if str(r.get('trade_date') or '')[:10]==canonical and (r.get('freshness') in ('STALE','UNKNOWN') or r.get('action_state')=='DATA_STALE')]
          if bad:
              raise SystemExit(f'Shadow latest-close semantics invalid: {bad[:10]}')
          print('Shadow version binding:', {k:m[k] for k in required})
          print('Shadow detail bundle:', {k:datasets[k].get('bytes') for k in required_ds})
          print('Shadow latest close semantics: OK', canonical)
          PY
          node --check docs/v2/app.js
          node --check docs/v2/market-capital-ui.js
          node --check docs/v2/quote-ui.js
          node --check docs/v2/stock-detail-bridge.js
          node --check docs/v2/detail-context-v3.js
          node --check docs/v2/card-display-v3.js
          # Only advance the stored EOD freeze after a newer independently
          # complete CLOSE passed all bundle and market-context checks.
          python scripts/v2/preserve_frozen_close.py --root docs/v2/data --frozen-root docs/v2/frozen-close/latest --capture-newer

      - name: Publish validated Shadow bundle to clean-build-v2
        id: publish_shadow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the validated generated bundle aside. Before every push attempt,
          # reset onto the newest clean-build-v2 so concurrent UI commits are never
          # overwritten; then re-apply only docs/v2/data from this validated run.
          rm -rf .shadow-generated-v2-data .shadow-generated-close-freeze
          cp -a docs/v2/data .shadow-generated-v2-data
          cp -a docs/v2/frozen-close/latest .shadow-generated-close-freeze

          for attempt in 1 2 3; do
            echo "Shadow publish attempt $attempt"
            git fetch origin clean-build-v2
            git reset --hard origin/clean-build-v2
            # Never let an older completion event overwrite a newer verified LIVE or CLOSE session.
            export SHADOW_CANDIDATE_MANIFEST=".shadow-generated-v2-data/current_manifest.json"
            if python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('docs/v2/data/current_manifest.json')
          q=Path(os.environ['SHADOW_CANDIDATE_MANIFEST'])
          if not p.is_file(): raise SystemExit(1)
          old=json.loads(p.read_text(encoding='utf-8')); new=json.loads(q.read_text(encoding='utf-8'))
          def date(m,k):
              return str(((m.get('datasets') or {}).get(k) or {}).get('as_of') or '')[:10]
          od=date(old,'decision_close_summary'); nd=date(new,'decision_close_summary')
          ot=str(old.get('trade_date') or '')[:10]; nt=str(new.get('trade_date') or '')[:10]
          oi=str(((old.get('datasets') or {}).get('decision_intraday_summary') or {}).get('as_of') or '')
          ni=str(((new.get('datasets') or {}).get('decision_intraday_summary') or {}).get('as_of') or '')
          newer_close=bool(od and nd and od>nd)
          newer_session=bool(ot and nt and ot>nt)
          newer_live=bool(ot==nt and old.get('session_phase')=='LIVE' and new.get('session_phase')=='LIVE' and oi>ni)
          if newer_close or newer_session or newer_live:
              print('Preserve newer remote Shadow session', {'old':ot,'new':nt,'old_close':od,'new_close':nd,'old_intra':oi,'new_intra':ni})
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              echo "Shadow publish skipped: canonical branch is newer."
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf docs/v2/data
            cp -a .shadow-generated-v2-data docs/v2/data
            rm -rf docs/v2/frozen-close/latest
            mkdir -p docs/v2/frozen-close
            cp -a .shadow-generated-close-freeze docs/v2/frozen-close/latest
            git add docs/v2/data docs/v2/frozen-close/latest

            if git diff --cached --quiet; then
              echo "No Shadow bundle changes"
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "chore(v2): sync Shadow bundle from production data [skip ci]"
            if git push origin HEAD:clean-build-v2; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Concurrent clean-build-v2 update detected; retrying on latest branch."
            sleep 2
          done

          echo "Shadow publish failed after 3 conflict-safe attempts" >&2
          exit 1

      - name: Publish newly synchronized V2 bundle to GitHub Pages
        # Intraday publishers have ALREADY deployed their verified Atomic
        # bundle. A second UI-only publish from the shadow branch races with
        # the next 5m/10m snapshot and can roll back LIVE 5m structure.
        # Only EOD close needs a post-shadow UI publication.
        if: ${{ steps.publish_shadow.outputs.changed == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Radar - Close Update' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Commits from GITHUB_TOKEN do not trigger push workflows.
          # Request a fresh Pages build only AFTER the Atomic bundle push,
          # so the deployed per-stock chip dates match the latest source.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v2-ui-deploy.yml/dispatches" \
            -f ref=main
          echo "Dispatched V2 publication after Shadow bundle sync"
