name: Clean Build 2.0 Shadow Sync

# close-freeze-resync-20261008

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-shadow-sync.yml"
  workflow_run:
    workflows:
      - "Radar - Intraday Update"
      - "Radar - Close Update"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: clean-build-v2-shadow-sync
  cancel-in-progress: true

jobs:
  sync-v2-shadow:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Clean Build 2.0 branch
        uses: actions/checkout@v4
        with:
          ref: clean-build-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install contract validator
        run: pip install -r requirements-contract.txt

      - name: Download exact production Pages artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .shadow-pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Pull production public datasets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .shadow-main-data .shadow-pages
          mkdir -p .shadow-main-data

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            mkdir -p .shadow-pages
            test -s .shadow-pages-artifact/artifact.tar
            tar -xf .shadow-pages-artifact/artifact.tar -C .shadow-pages
            cp .shadow-pages/data/close.json .shadow-main-data/close.json
            cp .shadow-pages/data/intraday.json .shadow-main-data/intraday.json
            cp .shadow-pages/data/daytrade.json .shadow-main-data/daytrade.json
            cp .shadow-pages/data/market.json .shadow-main-data/market.json
            echo "Shadow source: exact Pages artifact from upstream run ${{ github.event.workflow_run.id }}"
          else
            base="https://qqqbis-droid.github.io/dogson-stock-radar/data"
            for name in close intraday daytrade market; do
              curl -fsSL --retry 3 -H 'Cache-Control: no-cache' \
                "${base}/${name}.json?shadow_run=${GITHUB_RUN_ID}" \
                -o ".shadow-main-data/${name}.json"
            done
            echo "Shadow source: currently deployed GitHub Pages"
          fi

          test -s .shadow-main-data/close.json
          test -s .shadow-main-data/intraday.json
          test -s .shadow-main-data/daytrade.json
          test -s .shadow-main-data/market.json

          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('close','intraday','daytrade','market'):
              obj=json.loads(Path(f'.shadow-main-data/{name}.json').read_text(encoding='utf-8'))
              print(name, obj.get('trade_date') or obj.get('source_trade_date') or obj.get('date'))
          PY

      - name: Build 2.0 canonical atomic bundle
        run: python scripts/v2/build_legacy_bundle.py --legacy-root .shadow-main-data --output docs/v2/data

      - name: Copy canonical quote snapshot into lightweight indexes
        run: python scripts/v2/enrich_quote_index.py --output docs/v2/data

      - name: Migrate structural support / resistance zones
        run: python scripts/v2/enrich_zones.py --legacy-root .shadow-main-data --output docs/v2/data

      - name: Enrich mission-specific stock detail evidence
        run: python scripts/v2/enrich_stock_detail_context.py --legacy-root .shadow-main-data --root docs/v2/data

      - name: Restore market/capital and latest-close semantics
        run: |
          python scripts/v2/restore_market_capital_context.py --legacy-root .shadow-main-data --root docs/v2/data
          python scripts/v2/normalize_close_snapshot.py --root docs/v2/data
          python scripts/v2/stamp_version_contract.py --root docs/v2/data

      - name: Validate contract and UI syntax
        run: |
          python scripts/v2/validate_bundle.py --root docs/v2/data
          python scripts/v2/validate_market_capital_context.py --root docs/v2/data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/v2/data/current_manifest.json').read_text(encoding='utf-8'))
          required=(
              'version_registry_version','version_set_id','schema_version',
              'app_contract_version','engine_version','enum_registry_version',
              'threshold_registry_version','taxonomy_version',
          )
          missing=[k for k in required if not m.get(k)]
          if missing:
              raise SystemExit(f'Shadow Version Registry binding missing: {missing}')
          datasets=m.get('datasets') or {}
          required_ds=('zone_intraday','zone_close','zone_daytrade','stock_detail_intraday','stock_detail_close','stock_detail_daytrade')
          missing_ds=[k for k in required_ds if k not in datasets]
          if missing_ds:
              raise SystemExit(f'Shadow detail datasets missing: {missing_ds}')
          root=Path('docs/v2/data')
          def resolve(url):
              raw=str(url or '')
              return root/(raw[len('./data/'):] if raw.startswith('./data/') else raw.lstrip('./'))
          close=json.loads(resolve(datasets['decision_close_summary']['url']).read_text(encoding='utf-8'))
          canonical=str(m.get('trade_date') or '')[:10]
          bad=[r.get('code') for r in close if str(r.get('trade_date') or '')[:10]==canonical and (r.get('freshness') in ('STALE','UNKNOWN') or r.get('action_state')=='DATA_STALE')]
          if bad:
              raise SystemExit(f'Shadow latest-close semantics invalid: {bad[:10]}')
          print('Shadow version binding:', {k:m[k] for k in required})
          print('Shadow detail bundle:', {k:datasets[k].get('bytes') for k in required_ds})
          print('Shadow latest close semantics: OK', canonical)
          PY
          node --check docs/v2/app.js
          node --check docs/v2/market-capital-ui.js
          node --check docs/v2/quote-ui.js
          node --check docs/v2/stock-detail-bridge.js
          node --check docs/v2/detail-context-v3.js
          node --check docs/v2/card-display-v3.js

      - name: Publish validated Shadow bundle to clean-build-v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the validated generated bundle aside. Before every push attempt,
          # reset onto the newest clean-build-v2 so concurrent UI commits are never
          # overwritten; then re-apply only docs/v2/data from this validated run.
          rm -rf .shadow-generated-v2-data
          cp -a docs/v2/data .shadow-generated-v2-data

          for attempt in 1 2 3; do
            echo "Shadow publish attempt $attempt"
            git fetch origin clean-build-v2
            git reset --hard origin/clean-build-v2
            rm -rf docs/v2/data
            cp -a .shadow-generated-v2-data docs/v2/data
            git add docs/v2/data

            if git diff --cached --quiet; then
              echo "No Shadow bundle changes"
              exit 0
            fi

            git commit -m "chore(v2): sync Shadow bundle from production data [skip ci]"
            if git push origin HEAD:clean-build-v2; then
              exit 0
            fi

            echo "Concurrent clean-build-v2 update detected; retrying on latest branch."
            sleep 2
          done

          echo "Shadow publish failed after 3 conflict-safe attempts" >&2
          exit 1
