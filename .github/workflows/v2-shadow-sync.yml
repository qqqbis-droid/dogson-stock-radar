name: Clean Build 2.0 Shadow Sync

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-shadow-sync.yml"
  workflow_run:
    workflows:
      - "Radar - Intraday Update"
      - "Radar - Close Update"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: clean-build-v2-shadow-sync
  cancel-in-progress: true

jobs:
  sync-v2-shadow:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Clean Build 2.0 branch
        uses: actions/checkout@v4
        with:
          ref: clean-build-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install contract validator
        run: pip install -r requirements-contract.txt

      - name: Pull latest production public datasets from main
        run: |
          rm -rf .shadow-main-data
          mkdir -p .shadow-main-data
          git fetch origin main --depth=1
          git archive origin/main docs/data | tar -x -C .shadow-main-data --strip-components=2
          test -s .shadow-main-data/close.json
          test -s .shadow-main-data/intraday.json
          test -s .shadow-main-data/daytrade.json
          test -s .shadow-main-data/market.json

      - name: Build 2.0 canonical atomic bundle
        run: python scripts/v2/build_legacy_bundle.py --legacy-root .shadow-main-data --output docs/v2/data

      - name: Validate contract and UI syntax
        run: |
          python scripts/v2/validate_bundle.py --root docs/v2/data
          node --check docs/v2/app.js

      - name: Publish validated Shadow bundle to clean-build-v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2/data
          if git diff --cached --quiet; then
            echo "No Shadow bundle changes"
          else
            git commit -m "chore(v2): sync Shadow bundle from production data [skip ci]"
            git push origin HEAD:clean-build-v2
          fi
