e="number" min="1" step="1" inputmode="numeric"><small>1股也要記錄</small></label><label>成交均價<input name="avg_cost" required type="number" min="0.01" step="0.01" inputmode="decimal"></label></div><div class="portfolio-form-grid"><label>進場日期<input name="entry_date" type="date"></label><label>理由狀態<select name="reason_status"><option value="VALID">✅ 成立</option><option value="WEAKENING">⚠️ 弱化</option><option value="INVALID">❌ 失效</option></select></label></div><label>進場理由<textarea name="entry_reason" maxlength="800" placeholder="當初真正買進的核心理由；例如外資連買＋60分K轉強"></textarea></label><label>目前持有理由<textarea name="hold_reason" maxlength="800" placeholder="現在為什麼還持有？理由是否跟原本一致？"></textarea></label><label>驗證條件<textarea name="validation_condition" maxlength="800" placeholder="哪些條件維持，就代表原本判斷仍成立"></textarea></label><label>結構失效條件<textarea name="failure_condition" maxlength="800" placeholder="什麼情況才算原本結構確認失效，不用固定百分比停損"></textarea></label><label>目前策略<textarea name="strategy" maxlength="800" placeholder="續抱／等回測／確認後加碼／分批減碼等"></textarea></label><label>備註<textarea name="note" maxlength="800" placeholder="其他需要保留的交易紀錄"></textarea></label><div class="portfolio-local">這裡只記錄實際成交持股，資料只存在此瀏覽器，不會同步到公開 repository。</div><div class="portfolio-dialog-actions"><button id="portfolioDeleteBtn" class="text-btn" type="button" hidden>刪除紀錄</button><div class="right"><button id="portfolioCancelBtn" class="text-btn" type="button">取消</button><button class="refresh-btn" type="submit">儲存</button></div></div></form></dialog><dialog id="portfolioDetailDialog"><div class="dialog-head"><strong id="portfolioDetailTitle"></strong><button id="portfolioDetailClose" class="icon-btn" type="button" aria-label="關閉">×</button></div><div id="portfolioDetailBody"></div></dialog><footer>分數表示條件同步程度，不代表上漲機率；排名是注意力順序。資料過期或未通過 Contract Gate 時，系統停止提供可執行狀態。</footer></div><script src="./data-source.js?v=20260929c"></script><script src="./universe-search.js?v=20260930a"></script><script src="./theme-toggle.js?v=20260930a"></script><script src="./por
